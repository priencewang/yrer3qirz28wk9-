<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資產走勢</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  .viz-root {
    color-scheme: light;
    --surface-1:   #fcfcfb;
    --page-plane:  #f9f9f7;
    --text-primary:#0b0b0b;
    --text-secondary:#52514e;
    --text-muted:  #898781;
    --gridline:    #e1e0d9;
    --baseline:    #c3c2b7;
    --border:      rgba(11,11,11,0.10);
    --accent:      #2a78d6;
    --gain:        #e34948; /* 台股慣例：紅=漲/賺 */
    --loss:        #2a78d6; /* 台股慣例：藍=跌/賠 */
    --pnl-pos:     #a82424; /* 損益正數用略深紅，跟較昨日徽章的紅區分 */
    --trend-value: #6b4fd8; /* 資產走勢：總市值線 */
    --trend-cum:   #d08a1e; /* 資產走勢：累積已實現損益線 */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .viz-root {
      color-scheme: dark;
      --surface-1:   #1a1a19;
      --page-plane:  #0d0d0d;
      --text-primary:#ffffff;
      --text-secondary:#c3c2b7;
      --text-muted:  #898781;
      --gridline:    #2c2c2a;
      --baseline:    #383835;
      --border:      rgba(255,255,255,0.10);
      --accent:      #3987e5;
      --gain:        #e66767;
      --loss:        #3987e5;
      --pnl-pos:     #c23b3b;
      --trend-value: #a08cf0;
      --trend-cum:   #e8a948;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:   #1a1a19;
    --page-plane:  #0d0d0d;
    --text-primary:#ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:  #898781;
    --gridline:    #2c2c2a;
    --baseline:    #383835;
    --border:      rgba(255,255,255,0.10);
    --accent:      #3987e5;
    --gain:        #e66767;
    --loss:        #3987e5;
    --pnl-pos:     #c23b3b;
    --trend-value: #a08cf0;
    --trend-cum:   #e8a948;
  }

  .viz-root {
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100%;
    padding: 28px 20px 60px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .hdr { margin-bottom: 22px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .hdr h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  .hdr p { margin: 0; color: var(--text-secondary); font-size: 13px; }
  .hdr .history-link { font-size: 12.5px; color: var(--accent); text-decoration: none; white-space: nowrap; padding-top: 4px; }
  .hdr .history-link:hover { text-decoration: underline; }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 720px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .tile .value { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .tile .delta { font-size: 12.5px; margin-top: 4px; font-weight: 600; }
  .tile .delta.up { color: var(--gain); }
  .tile .delta.down { color: var(--loss); }
  .tile .delta.flat { color: var(--text-muted); }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  .card .sub { font-size: 12px; color: var(--text-secondary); margin: 0 0 14px; }

  .basis-toggle { display: inline-flex; gap: 4px; background: var(--gridline); padding: 3px; border-radius: 8px; margin-bottom: 14px; }
  .basis-btn { font-family: inherit; font-size: 12.5px; border: none; background: transparent; color: var(--text-secondary); padding: 6px 13px; border-radius: 6px; cursor: pointer; }
  .basis-btn.is-active { background: var(--surface-1); color: var(--text-primary); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .basis-btn:hover:not(.is-active) { color: var(--text-primary); }
  .basis-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* 券商切換(2026/11/04新增)：頁面最上方，永豐／元大／合併 */
  .acct-bar { display: flex; gap: 6px; flex-wrap: wrap; margin: -8px 0 10px; }
  .acct-btn { font-family: inherit; font-size: 14px; font-weight: 600; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); padding: 8px 16px; border-radius: 999px; cursor: pointer; }
  .acct-btn.is-active { background: var(--text-primary); border-color: var(--text-primary); color: var(--page-plane); }
  .acct-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .acct-note { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; line-height: 1.6; }
  .acct-note:empty { display: none; }
  .acct-note .warn { color: #c07a12; font-weight: 600; }

  .metric-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .metric-bar .basis-toggle { margin-bottom: 0; }
  .sort-btn { font-family: inherit; font-size: 12px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); padding: 6px 11px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .sort-btn.is-active { background: var(--gridline); color: var(--text-primary); font-weight: 700; }
  .sort-btn:disabled { opacity: .4; cursor: default; }
  .sort-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pie-layout { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .pie-svg-wrap { flex-shrink: 0; }
  .pie-selected-info { min-width: 130px; flex-shrink: 0; }
  .pie-selected-info .psi-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .pie-selected-info .psi-value { font-size: 21px; font-weight: 700; line-height: 1.25; }
  .pie-legend { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 3px; }
  .pie-legend-row {
    display: flex; align-items: center; gap: 9px; font-size: 13px; cursor: pointer;
    padding: 5px 7px; border-radius: 6px; margin: -5px -7px; transition: background .12s;
  }
  .pie-legend-row:hover { background: var(--gridline); }
  .pie-legend-row.is-selected { background: var(--gridline); font-weight: 700; }
  .pie-legend-row .sw { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .pie-legend-row .name { flex: 1; color: var(--text-secondary); }
  .pie-legend-row.is-selected .name { color: var(--text-primary); }
  .pie-legend-row .pct { font-weight: 700; font-variant-numeric: tabular-nums; }
  svg text { font-family: inherit; }
  .pie-slice { cursor: pointer; transition: opacity .15s, transform .15s; transform-box: fill-box; transform-origin: center; }

  .acc-item { border: 1px solid var(--border); border-radius: 9px; margin-bottom: 8px; overflow: hidden; }
  .acc-item .acc-item { border: none; border-top: 1px solid var(--gridline); border-radius: 0; margin-bottom: 0; }
  .acc-btn {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    background: var(--page-plane); border: none; cursor: pointer; font-family: inherit; text-align: left;
    -webkit-appearance: none; list-style: none;
  }
  .acc-btn::-webkit-details-marker { display: none; }
  .acc-btn::marker { content: ""; }
  .acc-btn .swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .acc-btn .name { font-weight: 700; font-size: 14px; color: var(--text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acc-btn .quick-val { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13.5px; flex-shrink: 0; }
  /* 2026/10/28 RAY要求：損益模式的數字，正數=略深紅、負數=藍(原本一律白色) */
  .acc-btn .quick-val.pnl-up { color: var(--pnl-pos); }
  .acc-btn .quick-val.pnl-down { color: var(--loss); }
  .acc-btn .count { color: var(--text-muted); font-size: 11.5px; flex-shrink: 0; }
  .acc-btn .delta-badge { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; white-space: nowrap; }
  .acc-btn .delta-badge.up { color: var(--gain); }
  .acc-btn .delta-badge.down { color: var(--loss); }
  .acc-btn .delta-badge.flat { color: var(--text-muted); }
  .acc-btn .arrow { color: var(--text-muted); transition: transform .15s; flex-shrink: 0; }
  details[open] > .acc-btn .arrow { transform: rotate(90deg); }
  .acc-btn:hover { background: var(--gridline); }
  .acc-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .acc-item .acc-item .acc-btn { padding: 9px 14px 9px 30px; }
  .acc-item .acc-item .acc-btn .name { font-size: 13px; font-weight: 600; }
  .acc-sublist { background: var(--gridline); }
  .acc-sublist .acc-item .acc-btn { background: var(--surface-1); }
  .acc-sublist .acc-item .acc-btn:hover { background: var(--page-plane); }

  .detail-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px;
    background: var(--gridline); border-top: 1px solid var(--gridline);
  }
  .detail-field { background: var(--surface-1); padding: 10px 14px; }
  .detail-field .f-label { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
  .detail-field .f-value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .detail-field .f-value.pnl-up { color: var(--gain); }
  .detail-field .f-value.pnl-down { color: var(--loss); }

  /* 資產走勢卡片(2026/11/03新增) */
  .trend-card { position: relative; overflow: hidden; }
  .trend-card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 150px; pointer-events: none;
    background: radial-gradient(120% 100% at 0% 0%, color-mix(in srgb, var(--trend-value) 14%, transparent), transparent 70%);
  }
  .trend-head { position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .trend-head .basis-toggle { margin-bottom: 0; }
  .trend-since { position: relative; font-size: 11px; color: var(--text-muted); margin: 10px 0 6px; }
  .trend-stats { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 0 14px; }
  @media (max-width: 720px) { .trend-stats { grid-template-columns: repeat(2, 1fr); } }
  .tstat { border-radius: 10px; padding: 10px 12px; background: var(--page-plane); border: 1px solid var(--border); min-width: 0; }
  .tstat .tl { font-size: 11.5px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
  .tstat .tl i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; box-sizing: border-box; }
  .tstat .tv { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 3px; white-space: nowrap; }
  .tstat .td { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; color: var(--text-muted); }
  .tstat .td.up, .tstat .tv.up { color: var(--gain); }
  .tstat .td.down, .tstat .tv.down { color: var(--loss); }
  .trend-chart { position: relative; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
  .trend-chart svg { display: block; overflow: visible; }
  .trend-sub-title { font-size: 12.5px; font-weight: 700; margin: 16px 0 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .trend-sub-title span { font-weight: 400; color: var(--text-muted); font-size: 11.5px; }
  .trend-legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-secondary); margin-top: 6px; }
  .trend-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .trend-legend .ln { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
  .trend-legend .ln.dash { background: repeating-linear-gradient(90deg, var(--text-muted) 0 4px, transparent 4px 7px); height: 2px; }
  .trend-legend .bx { width: 12px; height: 10px; border-radius: 3px; display: inline-block; }
  .trend-note { font-size: 11.5px; color: var(--text-muted); line-height: 1.75; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--gridline); }
  .trend-note b { color: var(--text-secondary); }
  .trend-tip {
    position: absolute; z-index: 5; pointer-events: none; opacity: 0; transition: opacity .12s;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 6px 22px rgba(0,0,0,.16); padding: 9px 11px; font-size: 12px; min-width: 172px;
  }
  .trend-tip.show { opacity: 1; }
  .trend-tip .tt-date { font-weight: 700; margin-bottom: 5px; }
  .trend-tip .tt-row { display: flex; justify-content: space-between; gap: 14px; line-height: 1.65; }
  .trend-tip .tt-row b { font-variant-numeric: tabular-nums; }
  .trend-tip .tt-row .k { color: var(--text-secondary); display: inline-flex; align-items: center; gap: 5px; }
  .trend-tip .tt-row .k i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .trend-tip .up { color: var(--gain); }
  .trend-tip .down { color: var(--loss); }
  .trend-tip hr { border: none; border-top: 1px solid var(--gridline); margin: 4px 0; }
  @keyframes trendDraw { to { stroke-dashoffset: 0; } }
  @keyframes trendFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes trendGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .t-anim-line { animation: trendDraw 1.1s cubic-bezier(.4,0,.2,1) forwards; }
  .t-anim-fade { opacity: 0; animation: trendFade .9s .35s ease forwards; }
  .t-anim-bar { transform-box: fill-box; transform: scaleY(0); animation: trendGrow .6s cubic-bezier(.3,1.3,.5,1) forwards; }
  @media (prefers-reduced-motion: reduce) {
    .t-anim-line, .t-anim-fade, .t-anim-bar { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0 !important; }
  }

  .empty-hint { text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px 0; }

  .footnote { font-size: 11.5px; color: var(--text-muted); line-height: 1.7; margin-top: 22px; border-top: 1px solid var(--gridline); padding-top: 14px; }
</style>
</head>

<body>
<div class="viz-root">
  <div class="wrap">
    <div class="hdr">
      <div>
        <h1>資產走勢</h1>
        <p id="hdr-sub"></p>
      </div>
      <a class="history-link" href="index.html">‹ 回到單日持股明細</a>
    </div>

    <div class="acct-bar" id="acct-bar"></div>

    <div class="card trend-card" id="trend-card">
      <div class="trend-head">
        <div>
          <h2 id="trend-title">資產走勢</h2>
          <p class="sub" id="trend-sub"></p>
        </div>
        <div class="basis-toggle" id="trend-range">
          <button class="basis-btn is-active" data-range="all">全部</button>
          <button class="basis-btn" data-range="90">近3月</button>
          <button class="basis-btn" data-range="30">近1月</button>
          <button class="basis-btn" data-range="14">近2週</button>
        </div>
      </div>
      <div class="trend-since" id="trend-since"></div>
      <div class="trend-stats" id="trend-stats"></div>
      <div class="trend-chart" id="trend-main"></div>
      <div class="trend-legend">
        <span><i class="ln" style="background:var(--trend-value)"></i>總市值</span>
        <span><i class="ln dash"></i>總成本</span>
        <span><i class="bx" style="background:color-mix(in srgb, var(--gain) 32%, transparent)"></i>帳上賺（市值高於成本）</span>
        <span><i class="bx" style="background:color-mix(in srgb, var(--loss) 32%, transparent)"></i>帳上賠</span>
      </div>
      <div class="trend-sub-title">已實現損益 <span id="trend-rp-note"></span></div>
      <div class="trend-chart" id="trend-rp"></div>
      <div class="trend-legend">
        <span><i class="bx" style="background:var(--gain)"></i>當天賣出賺</span>
        <span><i class="bx" style="background:var(--loss)"></i>當天賣出賠</span>
        <span><i class="ln" style="background:var(--trend-cum)"></i>累積</span>
        <span><i class="bx" style="background:var(--gridline)"></i>還沒有紀錄的期間</span>
      </div>
      <div class="trend-note" id="trend-note"></div>
      <div class="trend-tip" id="trend-tip"></div>
    </div>
  </div>

      const costLine = 'M' + cPts[0] + fwd(cSegs);
      const clipUp = el('clipPath', { id: uid + 'u' });
      clipUp.appendChild(el('path', { d: costLine + 'L' + cPts[n - 1][0] + ',0L' + cPts[0][0] + ',0Z' }));
      const clipDn = el('clipPath', { id: uid + 'd' });
      clipDn.appendChild(el('path', { d: costLine + 'L' + cPts[n - 1][0] + ',' + H + 'L' + cPts[0][0] + ',' + H + 'Z' }));
      defs.appendChild(clipUp); defs.appendChild(clipDn);
      defs.appendChild(grad(uid + 'gu', tok('--gain'), 0.36, 0.10));
      defs.appendChild(grad(uid + 'gd', tok('--loss'), 0.10, 0.36));
      const glow = el('filter', { id: uid + 'glow', x: '-5%', y: '-30%', width: '110%', height: '160%' });
      glow.appendChild(el('feDropShadow', { dx: 0, dy: 3, stdDeviation: 3, 'flood-color': tok('--trend-value'), 'flood-opacity': 0.35 }));
      defs.appendChild(glow);
      const bandG = el('g', {});
      bandG.appendChild(el('path', { d: band, fill: 'url(#' + uid + 'gu)', 'clip-path': 'url(#' + uid + 'u)' }));
      bandG.appendChild(el('path', { d: band, fill: 'url(#' + uid + 'gd)', 'clip-path': 'url(#' + uid + 'd)' }));
      if (animate) bandG.classList.add('t-anim-fade');
      svg.appendChild(bandG);
      const cPath = el('path', { d: costLine, fill: 'none', stroke: tok('--text-muted'), 'stroke-width': 1.6, 'stroke-dasharray': '5 4', 'stroke-linecap': 'round' });
      if (animate) cPath.classList.add('t-anim-fade');
      svg.appendChild(cPath);
      const vPath = el('path', { d: 'M' + vPts[0] + fwd(vSegs), fill: 'none', stroke: tok('--trend-value'), 'stroke-width': 2.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', filter: 'url(#' + uid + 'glow)' });
      svg.appendChild(vPath);
      if (animate) requestAnimationFrame(() => animateLine(vPath));
    }
    if (S.length) {
      // 最後一天的點加一圈光暈，強調「現在在這裡」(只有一個點時也畫得出來)
      const last = S[S.length - 1];
      const lx = xD(last.date), ly = yM(last.value);
      const lastG = el('g', {});
      if (S.length === 1) lastG.appendChild(el('circle', { cx: lx, cy: yM(last.cost), r: 3.5, fill: tok('--surface-1'), stroke: tok('--text-muted'), 'stroke-width': 2 }));
      lastG.appendChild(el('circle', { cx: lx, cy: ly, r: 7.5, fill: tok('--trend-value'), opacity: 0.18 }));
      lastG.appendChild(el('circle', { cx: lx, cy: ly, r: 3.8, fill: tok('--trend-value'), stroke: tok('--surface-1'), 'stroke-width': 2 }));
      if (animate) lastG.classList.add('t-anim-fade');
      svg.appendChild(lastG);
    }
    if (S.length < 2) {
      const msg = S.length ? '市值從 ' + md(S[0].date) + ' 才開始每天記錄，之後會慢慢連成線' : '這段期間還沒有市值紀錄';
      const t = el('text', { x: (padL + W - padR) / 2, y: (top + H - bot) / 2, 'text-anchor': 'middle', 'font-size': 12, fill: tok('--text-muted') });
      t.textContent = msg; svg.appendChild(t);
    }
    hov.appendChild(hLine); hov.appendChild(hDotC); hov.appendChild(hDotV);
    svg.appendChild(hov);
    mainBox.innerHTML = ''; mainBox.appendChild(svg);

    // ---- 下方小圖：已實現損益(長條＝當天、橘線＝累積，累積是階梯線：沒賣出的日子維持不變) ----
    const H2 = 132, top2 = 10, bot2 = 22;
    const svg2 = el('svg', { width: W, height: H2, viewBox: '0 0 ' + W + ' ' + H2 });
    const defs2 = el('defs', {}); svg2.appendChild(defs2);
    const from = acc.realized_from;
    const vals = [0, V.cumBefore];
    R.forEach(r => vals.push(r.pnl, r.cum));
    let lo2 = Math.min(...vals), hi2 = Math.max(...vals);
    if (lo2 === hi2) { lo2 -= 10000; hi2 += 10000; }
    const pad2 = (hi2 - lo2) * 0.14;
    lo2 = Math.min(0, lo2 - pad2); hi2 = Math.max(0, hi2 + pad2);
    const y2 = (v) => top2 + (hi2 - v) / (hi2 - lo2) * (H2 - top2 - bot2);
    // 還沒有紀錄的期間塗灰，跟「0元」區分開
    if (!from || from > V.start) {
      const xe = from ? xD(from) : W - padR;
      svg2.appendChild(el('rect', { x: padL, y: top2, width: Math.max(0, xe - padL), height: H2 - top2 - bot2, fill: tok('--gridline'), opacity: 0.55 }));
      if (xe - padL > 90) {
        const t = el('text', { x: (padL + xe) / 2, y: (top2 + H2 - bot2) / 2 + 4, 'text-anchor': 'middle', 'font-size': 11.5, fill: tok('--text-muted') });
        t.textContent = '還沒有紀錄'; svg2.appendChild(t);
      }
    }
    niceTicks(lo2, hi2, 4).forEach(v => {
      svg2.appendChild(el('line', { x1: padL, x2: W - padR, y1: y2(v), y2: y2(v), stroke: Math.abs(v) < 1e-6 ? tok('--baseline') : tok('--gridline'), 'stroke-width': 1 }));
      const t = el('text', { x: padL - 7, y: y2(v) + 4, 'text-anchor': 'end', 'font-size': 10.5, fill: tok('--text-muted') });
      t.textContent = wan(v); svg2.appendChild(t);
    });
    xAxis(svg2, H2 - 6);
    const bw = Math.max(3, Math.min(14, (W - padL - padR) / Math.max(1, spanDays) * 0.7));
    let barNo = 0;
    R.forEach(r => {
      if (!r.pnl) return;
      const yv = y2(r.pnl), y0 = y2(0);
      const rc = el('rect', { x: xD(r.date) - bw / 2, y: Math.min(yv, y0), width: bw, height: Math.max(1.5, Math.abs(yv - y0)), rx: Math.min(3, bw / 3), fill: r.pnl > 0 ? tok('--gain') : tok('--loss'), opacity: 0.85 });
      if (animate) { rc.classList.add('t-anim-bar'); rc.style.transformOrigin = 'center ' + (r.pnl > 0 ? 'bottom' : 'top'); rc.style.animationDelay = (0.25 + Math.min(barNo++, 20) * 0.05) + 's'; }
      svg2.appendChild(rc);
    });
    if (from && from <= V.end) {
      const sx = xD(from > V.start ? from : V.start);
      let d = 'M' + sx.toFixed(2) + ',' + y2(from > V.start ? 0 : V.cumBefore).toFixed(2);
      R.forEach(r => { const x = xD(r.date).toFixed(2); d += 'H' + x + 'V' + y2(r.cum).toFixed(2); });
      d += 'H' + (W - padR);
      const lastCum = R.length ? R[R.length - 1].cum : V.cumBefore;
      const cp = el('path', { d, fill: 'none', stroke: tok('--trend-cum'), 'stroke-width': 2.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
      svg2.appendChild(cp);
      if (animate) requestAnimationFrame(() => animateLine(cp));
      svg2.appendChild(el('circle', { cx: W - padR, cy: y2(lastCum), r: 3.2, fill: tok('--trend-cum'), stroke: tok('--surface-1'), 'stroke-width': 2 }));
    }
    const hov2 = el('g', { opacity: 0 });
    const hLine2 = el('line', { y1: top2, y2: H2 - bot2, stroke: tok('--baseline'), 'stroke-width': 1 });
    hov2.appendChild(hLine2);
    svg2.appendChild(hov2);
    rpBox.innerHTML = ''; rpBox.appendChild(svg2);

    // hover可以停的日子：有市值點的日子＋有賣出的日子
    const stops = Array.from(new Set(S.map(s => s.date).concat(R.filter(r => r.pnl || (r.items && r.items.length)).map(r => r.date)))).sort();
    geo = { xD, yM, stops, hov, hLine, hDotV, hDotC, hov2, hLine2 };
  }

  function cumAt(date) {
    if (!acc.realized_from || date < acc.realized_from) return null;
    let c = 0;
    acc.realized.forEach(r => { if (r.date <= date) c += r.pnl; });
    return c;
  }
  function showAt(clientX, box) {
    if (!geo || !geo.stops.length) return;
    const rect = box.getBoundingClientRect();
    const x = clientX - rect.left;
    let best = geo.stops[0];
    geo.stops.forEach(d => { if (Math.abs(geo.xD(d) - x) < Math.abs(geo.xD(best) - x)) best = d; });
    const xi = geo.xD(best);
    const s = V.S.find(p => p.date === best);
    const r = V.R.find(p => p.date === best);
    [geo.hLine, geo.hLine2].forEach(l => { l.setAttribute('x1', xi); l.setAttribute('x2', xi); });
    geo.hDotV.setAttribute('opacity', s ? 1 : 0); geo.hDotC.setAttribute('opacity', s ? 1 : 0);
    if (s) {
      geo.hDotV.setAttribute('cx', xi); geo.hDotV.setAttribute('cy', geo.yM(s.value));
      geo.hDotC.setAttribute('cx', xi); geo.hDotC.setAttribute('cy', geo.yM(s.cost));
    }
    geo.hov.setAttribute('opacity', 1); geo.hov2.setAttribute('opacity', 1);
    let html = '<div class="tt-date">' + best.replace(/-/g, '/') + '</div>';
    if (s) {
      const i = V.S.indexOf(s), prev = V.S[i - 1];
      html += '<div class="tt-row"><span class="k"><i style="background:' + tok('--trend-value') + '"></i>總市值</span><b>' + fmtMoney(s.value) + '</b></div>' +
        (prev ? '<div class="tt-row"><span class="k">　較前一筆</span><b class="' + dirCls(s.value - prev.value) + '">' + signMoney(s.value - prev.value) + '</b></div>' : '') +
        '<div class="tt-row"><span class="k"><i style="background:' + tok('--text-muted') + '"></i>總成本</span><b>' + fmtMoney(s.cost) + '</b></div>' +
        '<div class="tt-row"><span class="k">帳上未實現</span><b class="' + dirCls(s.value - s.cost) + '">' + signMoney(s.value - s.cost) + '</b></div>';
    } else {
      html += '<div class="tt-row"><span class="k">總市值</span><b>這天沒有庫存紀錄</b></div>';
    }
    html += '<hr>';
    const c = cumAt(best);
    if (c === null) {
      html += '<div class="tt-row"><span class="k">已實現損益</span><b>還沒開始記錄</b></div>';
    } else {
      const day = r ? r.pnl : 0;
      html += '<div class="tt-row"><span class="k">當天已實現</span><b class="' + dirCls(day) + '">' + (r && (r.pnl || (r.items && r.items.length)) ? signMoney(day) : '沒有賣出') + '</b></div>';
      if (r && r.items && r.items.length) {
        r.items.slice(0, 6).forEach(it => { html += '<div class="tt-row"><span class="k">　' + esc(it.name) + '</span><b class="' + dirCls(it.pnl) + '">' + signMoney(it.pnl) + '</b></div>'; });
        if (r.items.length > 6) html += '<div class="tt-row"><span class="k">　…還有 ' + (r.items.length - 6) + ' 筆</span><b></b></div>';
      }
      html += '<div class="tt-row"><span class="k"><i style="background:' + tok('--trend-cum') + '"></i>累積已實現</span><b class="' + dirCls(c) + '">' + signMoney(c) + '</b></div>';
    }
    tip.innerHTML = html;
    tip.classList.add('show');
    const cardRect = card.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    const base = rect.left - cardRect.left + xi;
    let left = base + 14;
    if (left + tw > card.clientWidth - 8) left = base - tw - 14;
    left = Math.max(8, left);
    const topPos = mainBox.getBoundingClientRect().top - cardRect.top + 4;
    tip.style.left = left + 'px';
    tip.style.top = Math.max(4, Math.min(topPos, card.clientHeight - th - 8)) + 'px';
  }
  function hide() {
    if (!geo) return;
    geo.hov.setAttribute('opacity', 0); geo.hov2.setAttribute('opacity', 0);
    tip.classList.remove('show');
  }
  [mainBox, rpBox].forEach(box => {
    box.addEventListener('pointermove', e => showAt(e.clientX, box));
    box.addEventListener('pointerdown', e => showAt(e.clientX, box));
    box.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
  });
  document.addEventListener('pointerdown', e => { if (!mainBox.contains(e.target) && !rpBox.contains(e.target)) hide(); });

  // 每家的「看圖前先知道」
  function notes() {
    const out = [];
    const f = acc.realized_from ? ymd(acc.realized_from) : null;
    if (acc.key === 'sinopac') {
      out.push('已實現損益從 ' + (f || '—') + ' 才開始記錄（永豐只能從那天起每天累積），之前賣出股票的賺賠圖上看不到；那段期間總市值、總成本如果突然一起大降，多半是賣掉股票。');
      out.push('ETF 配息後，永豐會把 ETF 的成本往下調（配息抵掉成本），所以總成本線偶爾小幅往下跳，不一定是有賣股票；ETF 真正投入多少錢請看「ETF真實成本」頁。');
      out.push('少數平日沒有庫存資料（排程沒跑，例如 7/23、8/26、9/7、9/8），圖上直接連到下一個有資料的日子。');
    } else if (acc.key === 'combined') {
      const each = acc.realized_from_each || {};
      out.push('同一天每家都有庫存紀錄才畫得出合併的市值點，所以市值從 ' + (acc.snaps[0] ? ymd(acc.snaps[0].date) : '—') + ' 開始。');
      out.push('已實現損益：' + Object.keys(each).map(k => k + '從 ' + (each[k] ? ymd(each[k]) : '—')).join('、') + ' 起才有紀錄，比較晚開始的那家，之前的賣出沒算進累積。');
    } else {
      out.push('市值、總成本從 ' + (acc.snaps[0] ? ymd(acc.snaps[0].date) : '—') + ' 才開始每天存，之前沒有資料。');
      out.push('已實現損益是元大 API 往回補的（最多查近一年），從 ' + (f || '—') + ' 起都有；元大的損益已經扣掉手續費和證交稅。');
    }
    document.getElementById('trend-note').innerHTML = '<b>看圖前先知道：</b><br>' + out.map(s => '・' + esc(s)).join('<br>');
  }

  function apply(animate) {
    prepare();
    document.getElementById('trend-title').textContent = acc.label + '資產走勢';
    document.getElementById('trend-sub').textContent = '每天收盤後的庫存總市值、總成本，跟賣出股票的已實現損益';
    document.getElementById('trend-rp-note').textContent = acc.realized_from ? '（' + ymd(acc.realized_from) + ' 起才有紀錄）' : '（還沒有紀錄）';
    hide();
    renderStats();
    render(animate);
    notes();
  }
  function selectAccount(key) {
    acc = ACCS.find(a => a.key === key) || ACCS[0];
    bar.querySelectorAll('.acct-btn').forEach(b => b.classList.toggle('is-active', b.dataset.key === acc.key));
    try { localStorage.setItem('ds_account', acc.key); } catch (e) {}
    apply(true);
  }
  if (!ACCS.length) { card.innerHTML = '<p class="sub">還沒有資料</p>'; return; }
  if (ACCS.length < 2) bar.remove();
  ACCS.forEach(a => {
    const b = document.createElement('button');
    b.className = 'acct-btn'; b.dataset.key = a.key; b.textContent = a.label;
    b.addEventListener('click', () => selectAccount(a.key));
    bar.appendChild(b);
  });
  document.querySelectorAll('#trend-range .basis-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      range = btn.dataset.range;
      document.querySelectorAll('#trend-range .basis-btn').forEach(b => b.classList.toggle('is-active', b === btn));
      apply(true);
    });
  });
  // 跟首頁共用同一個「上次看哪一家」(同一個網站，localStorage共用)
  let saved = 'sinopac';
  try { saved = localStorage.getItem('ds_account') || 'sinopac'; } catch (e) {}
  selectAccount(ACCS.some(a => a.key === saved) ? saved : 'sinopac');
  let lastW = mainBox.clientWidth, rT = null;
  window.addEventListener('resize', () => {
    clearTimeout(rT);
    rT = setTimeout(() => { if (mainBox.clientWidth !== lastW) { lastW = mainBox.clientWidth; hide(); render(false); } }, 150);
  });
})();
</script>
</body>
</html>
