<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETF真實成本</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  .viz-root {
    color-scheme: light;
    --surface-1:   #fcfcfb;
    --page-plane:  #f9f9f7;
    --text-primary:#0b0b0b;
    --text-secondary:#52514e;
    --text-muted:  #898781;
    --gridline:    #e1e0d9;
    --border:      rgba(11,11,11,0.10);
    --accent:      #2a78d6;
    --gain:        #e34948; /* 台股慣例：紅=漲/賺 */
    --loss:        #2a78d6; /* 台股慣例：藍=跌/賠 */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .viz-root {
      color-scheme: dark;
      --surface-1:   #1a1a19;
      --page-plane:  #0d0d0d;
      --text-primary:#ffffff;
      --text-secondary:#c3c2b7;
      --text-muted:  #898781;
      --gridline:    #2c2c2a;
      --border:      rgba(255,255,255,0.10);
      --accent:      #3987e5;
      --gain:        #e66767;
      --loss:        #3987e5;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:   #1a1a19;
    --page-plane:  #0d0d0d;
    --text-primary:#ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:  #898781;
    --gridline:    #2c2c2a;
    --border:      rgba(255,255,255,0.10);
    --accent:      #3987e5;
    --gain:        #e66767;
    --loss:        #3987e5;
  }
  .viz-root {
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100%;
    padding: 28px 20px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .hdr { margin-bottom: 22px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .hdr h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  .hdr p { margin: 0; color: var(--text-secondary); font-size: 13px; }
  .hdr .back-link { font-size: 12.5px; color: var(--accent); text-decoration: none; white-space: nowrap; padding-top: 4px; }
  .hdr .back-link:hover { text-decoration: underline; }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 720px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .tile .value { font-size: 21px; font-weight: 700; line-height: 1.2; }
  .tile .sub { font-size: 12.5px; margin-top: 4px; font-weight: 600; }
  .tile .sub.up { color: var(--gain); }
  .tile .sub.down { color: var(--loss); }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  .card .sub { font-size: 12px; color: var(--text-secondary); margin: 0 0 14px; }

  .acc-item { border: 1px solid var(--border); border-radius: 9px; margin-bottom: 8px; overflow: hidden; }
  .acc-btn {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    background: var(--page-plane); border: none; cursor: pointer; font-family: inherit; text-align: left;
    -webkit-appearance: none; list-style: none;
  }
  .acc-btn::-webkit-details-marker { display: none; }
  .acc-btn::marker { content: ""; }
  .acc-btn .name { font-weight: 700; font-size: 14px; color: var(--text-primary); flex-shrink: 0; }
  .acc-btn .code { color: var(--text-muted); font-size: 11.5px; flex: 1; }
  .acc-btn .pnl { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; flex-shrink: 0; }
  .acc-btn .pnl.up { color: var(--gain); }
  .acc-btn .pnl.down { color: var(--loss); }
  .acc-btn .pct { font-size: 11.5px; font-variant-numeric: tabular-nums; flex-shrink: 0; min-width: 52px; text-align: right; }
  .acc-btn .pct.up { color: var(--gain); }
  .acc-btn .pct.down { color: var(--loss); }
  .acc-btn .arrow { color: var(--text-muted); transition: transform .15s; flex-shrink: 0; }
  details[open] > .acc-btn .arrow { transform: rotate(90deg); }
  .acc-btn:hover { background: var(--gridline); }
  .acc-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .bar-wrap { padding: 4px 14px 14px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11.5px; color: var(--text-secondary); }
  .bar-row .bar-label { width: 68px; flex-shrink: 0; }
  .bar-track { flex: 1; height: 8px; border-radius: 4px; background: var(--gridline); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .bar-row .bar-value { width: 92px; flex-shrink: 0; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-primary); font-weight: 600; }

  .detail-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px;
    background: var(--gridline); border-top: 1px solid var(--gridline);
  }
  .detail-field { background: var(--surface-1); padding: 10px 14px; }
  .detail-field .f-label { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
  .detail-field .f-value { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .detail-field .f-value.up { color: var(--gain); }
  .detail-field .f-value.down { color: var(--loss); }

  .footnote { font-size: 11.5px; color: var(--text-muted); line-height: 1.7; padding: 4px 2px; }
  .empty { padding: 24px 12px; color: var(--text-secondary); font-size: 13px; text-align: center; }
</style>
</head>
<body>

<div class="viz-root">

    <div class="footnote" id="footnote"></div>

</div>

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('etf-cost-data').textContent);
  const fmtMoney = (n) => n === null || n === undefined ? '—' : '$' + Math.round(n).toLocaleString('en-US');
  const fmtPct = (n, d) => n === null || n === undefined ? '—' : (n > 0 ? '+' : '') + n.toFixed(d === undefined ? 1 : d) + '%';

  document.getElementById('hdr-sub').textContent =
    DATA.date ? ('目前市值資料日期：' + DATA.date + '（來源：' + DATA.source_file + '）') : '尚未產生資料';

  const kpi = DATA.kpi || {};
  const kpiRow = document.getElementById('kpi-row');
  const returnDir = (kpi.total_real_pnl || 0) >= 0 ? 'up' : 'down';
  const tiles = [
    { label: '真實投入本金合計', value: fmtMoney(kpi.total_real_principal) },
    { label: '目前市值合計', value: fmtMoney(kpi.total_real_value) },
    { label: '真實損益合計', value: fmtMoney(kpi.total_real_pnl), sub: fmtPct(kpi.total_real_return_pct) + '（對真實本金）', dir: returnDir },
    { label: '累積配息扣抵合計', value: fmtMoney(kpi.total_ex_dividends), sub: '官方成本因此被拉低的金額' },
  ];
  tiles.forEach(t => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = '<div class="label"></div><div class="value"></div>' + (t.sub ? '<div class="sub"></div>' : '');
    tile.querySelector('.label').textContent = t.label;
    tile.querySelector('.value').textContent = t.value;
    if (t.sub) {
      const s = tile.querySelector('.sub');
      s.textContent = t.sub;
      if (t.dir) s.classList.add(t.dir);
    }
    kpiRow.appendChild(tile);
  });

  const listEl = document.getElementById('etf-list');
  const rows = DATA.table_rows || [];
  if (!rows.length) {
    listEl.innerHTML = '<div class="empty">目前沒有資料，請先執行 fetch_etf_cost_basis.py 跟 build_etf_cost_data.py</div>';
  } else {
    const maxScale = Math.max(...rows.map(r => Math.max(r.real_principal || 0, r.real_value || 0)), 1);
    rows.forEach(r => {
      const pnlDir = (r.real_pnl || 0) >= 0 ? 'up' : 'down';
      const officialPnlDir = (r.official_pnl || 0) >= 0 ? 'up' : 'down';
      const item = document.createElement('details');
      item.className = 'acc-item';
      const principalPct = Math.max((r.real_principal || 0) / maxScale * 100, 1);
      const valuePct = Math.max((r.real_value || 0) / maxScale * 100, 1);
      item.innerHTML = `
        <summary class="acc-btn">
          <span class="name">${r.name}</span>
          <span class="code">${r.code}</span>
          <span class="pct ${pnlDir}">${fmtPct(r.real_return_pct)}</span>
          <span class="pnl ${pnlDir}">${fmtMoney(r.real_pnl)}</span>
          <span class="arrow">›</span>
        </summary>
        <div class="bar-wrap">
          <div class="bar-row">
            <span class="bar-label">真實本金</span>
            <div class="bar-track"><div class="bar-fill" style="width:${principalPct}%;background:var(--text-muted)"></div></div>
            <span class="bar-value">${fmtMoney(r.real_principal)}</span>
          </div>
          <div class="bar-row">
            <span class="bar-label">目前市值</span>
            <div class="bar-track"><div class="bar-fill" style="width:${valuePct}%;background:var(--${pnlDir === 'up' ? 'gain' : 'loss'})"></div></div>
            <span class="bar-value">${fmtMoney(r.real_value)}</span>
          </div>
        </div>
        <div class="detail-grid">
          <div class="detail-field"><div class="f-label">持有股數</div><div class="f-value">${r.shares != null ? r.shares.toLocaleString('en-US') : '—'}</div></div>
          <div class="detail-field"><div class="f-label">最早買進日</div><div class="f-value">${r.earliest_buy_date || '—'}</div></div>
          <div class="detail-field"><div class="f-label">買進批次數</div><div class="f-value">${r.batch_count != null ? r.batch_count + ' 批' : '—'}</div></div>
          <div class="detail-field"><div class="f-label">累積配息扣抵</div><div class="f-value">${fmtMoney(r.cumulative_ex_dividends)}</div></div>
          <div class="detail-field"><div class="f-label">真實損益</div><div class="f-value ${pnlDir}">${fmtMoney(r.real_pnl)}</div></div>
          <div class="detail-field"><div class="f-label">真實報酬率</div><div class="f-value ${pnlDir}">${fmtPct(r.real_return_pct)}</div></div>
          <div class="detail-field"><div class="f-label">官方顯示成本</div><div class="f-value">${fmtMoney(r.official_cost)}</div></div>
          <div class="detail-field"><div class="f-label">官方顯示損益</div><div class="f-value ${officialPnlDir}">${fmtMoney(r.official_pnl)}</div></div>
        </div>
      `;
      listEl.appendChild(item);
    });
  }

  document.getElementById('footnote').innerHTML =
    '真實本金：把每一批買進當下的原始成交金額加總，是固定不變的歷史紀錄，不會因為之後配息被拉低。' +
    '官方成本/損益：永豐系統「成本均價」算出來的數字，月配息ETF常見的「收益平準金」會讓這個成本隨時間往下調整。' +
    '目前市值算法跟「單日持股明細」同一套（付出成本+損益試算反推，含稅口徑），不是現價×股數。' +
    (DATA.log_last_run_at ? ('批次資料最後更新：' + DATA.log_last_run_at) : '');
})();
</script>

</body>
</html>
