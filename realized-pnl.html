    --warn-bg:     #fdf3e5;
    --warn-text:   #8a5a12;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .viz-root {
      color-scheme: dark;
      --surface-1:   #1a1a19;
      --page-plane:  #0d0d0d;
      --text-primary:#ffffff;
      --text-secondary:#c3c2b7;
      --text-muted:  #898781;
      --gridline:    #2c2c2a;
      --border:      rgba(255,255,255,0.10);
      --accent:      #3987e5;
      --gain:        #e66767;
      --loss:        #3987e5;
      --warn-bg:     #332a18;
      --warn-text:   #e8b56a;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:   #1a1a19;
    --page-plane:  #0d0d0d;
    --text-primary:#ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:  #898781;
    --gridline:    #2c2c2a;
    --border:      rgba(255,255,255,0.10);
    --accent:      #3987e5;
    --gain:        #e66767;
    --loss:        #3987e5;
    --warn-bg:     #332a18;
    --warn-text:   #e8b56a;
  }

  .viz-root {
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100%;
    padding: 28px 20px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .hdr { margin-bottom: 22px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .hdr h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  .hdr p { margin: 0; color: var(--text-secondary); font-size: 13px; }
  .hdr .back-link { font-size: 12.5px; color: var(--accent); text-decoration: none; white-space: nowrap; padding-top: 4px; }
  .hdr .back-link:hover { text-decoration: underline; }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  .card .sub { font-size: 12px; color: var(--text-secondary); margin: 0 0 14px; }

  .range-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .range-field { display: flex; flex-direction: column; gap: 4px; }
  .range-field label { font-size: 11.5px; color: var(--text-secondary); }
  .range-field select, .range-field input {
    font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text-primary);
    background: var(--page-plane); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; min-width: 132px;
  }
  .range-sep { color: var(--text-muted); font-size: 13px; padding-top: 16px; }

  .acct-btn { font-family: inherit; font-size: 14px; font-weight: 600; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); padding: 8px 16px; border-radius: 999px; cursor: pointer; }
  .acct-btn.is-active { background: var(--text-primary); border-color: var(--text-primary); color: var(--page-plane); }
  .quick-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
  .quick-btn { font-family: inherit; font-size: 12.5px; border: 1px solid var(--border); background: var(--page-plane); color: var(--text-secondary); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .quick-btn.is-active { color: var(--text-primary); font-weight: 700; border-color: var(--text-secondary); }

  .tile { background: var(--page-plane); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .tile .value { font-size: 21px; font-weight: 700; line-height: 1.2; }
  .tile .value.pnl-up { color: var(--gain); }
  .tile .value.pnl-down { color: var(--loss); }

  .warn-banner {
    background: var(--warn-bg); color: var(--warn-text); border-radius: 9px;
    padding: 10px 14px; font-size: 12px; line-height: 1.6; margin: 14px 0 0;
  }

  .acc-item { border: 1px solid var(--border); border-radius: 9px; margin-bottom: 8px; overflow: hidden; }
  .acc-item .acc-item { border: none; border-top: 1px solid var(--gridline); border-radius: 0; margin-bottom: 0; }
  .acc-btn {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    background: var(--page-plane); border: none; cursor: pointer; font-family: inherit; text-align: left;
    -webkit-appearance: none; list-style: none;
  }
  .acc-btn::-webkit-details-marker { display: none; }
  .acc-btn::marker { content: ""; }
  .acc-btn .name { font-weight: 700; font-size: 14px; color: var(--text-primary); flex: 1; min-width: 0; }
  .acc-btn .quick-val { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13.5px; flex-shrink: 0; }
  .acc-btn .count { color: var(--text-muted); font-size: 11.5px; flex-shrink: 0; }
  .acc-btn .arrow { color: var(--text-muted); transition: transform .15s; flex-shrink: 0; }
  details[open] > .acc-btn .arrow { transform: rotate(90deg); }
  .acc-btn:hover { background: var(--gridline); }
  .acc-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .acc-item .acc-item .acc-btn { padding: 9px 14px 9px 30px; }
  .acc-item .acc-item .acc-btn .name { font-size: 13px; font-weight: 600; }
  .acc-sublist { background: var(--gridline); }
  .acc-sublist .acc-item .acc-btn { background: var(--surface-1); }
  .acc-sublist .acc-item .acc-btn:hover { background: var(--page-plane); }

  .detail-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px;
    background: var(--gridline); border-top: 1px solid var(--gridline);
  }
  .detail-field { background: var(--surface-1); padding: 10px 14px; }
  .detail-field .f-label { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
  .detail-field .f-value { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .detail-field .f-value.pnl-up { color: var(--gain); }
  .detail-field .f-value.pnl-down { color: var(--loss); }

  .empty-hint { text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px 0; }
  .footnote { font-size: 11.5px; color: var(--text-muted); line-height: 1.7; padding: 4px 2px; }
</style>

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('realized-pnl-history-data').textContent);
  // 2026/11/04改版：資料分券商(永豐/元大/合併)，每家都能查近一年(見build_realized_pnl_history_data.py)
  const ACCS = DATA.accounts || [];

  const fmtMoney = (n) => n === null || n === undefined ? '—' : '$' + Math.round(n).toLocaleString('en-US');
  const fmtPct = (n, d) => n === null || n === undefined ? '—' : (n > 0 ? '+' : '') + n.toFixed(d === undefined ? 1 : d) + '%';
  const fmtNum = (n, d) => n === null || n === undefined ? '—' : Number(n).toLocaleString('en-US', { maximumFractionDigits: d === undefined ? 0 : d });
  const DAY = 86400000;
  const iso = (t) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const T = (d) => new Date(d + 'T00:00:00').getTime();

  const startSel = document.getElementById('start-date');
  const endSel = document.getElementById('end-date');
  const bar = document.getElementById('acct-bar');
  let acc = null;

  const RP_FIELDS = [
    { key: 'quantity', label: '賣出股數', fmt: (v) => fmtNum(v) },
    { key: 'entry_price', label: '平均買進價', fmt: (v) => fmtNum(v, 2) },
    { key: 'cover_price', label: '賣出價', fmt: (v) => fmtNum(v, 2) },
    { key: 'entry_cost', label: '原始成本', fmt: fmtMoney },
    { key: 'cover_cost', label: '賣出收回金額', fmt: fmtMoney },
    { key: 'pnl', label: '已實現損益', fmt: fmtMoney, pnlColor: true },
    { key: 'pr_ratio', label: '報酬率', fmt: (v) => fmtPct(v, 2), pnlColor: true },
  ];

  function buildTile(label, value, dir) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = '<div class="label"></div><div class="value"></div>';
    tile.querySelector('.label').textContent = label;
    const valueEl = tile.querySelector('.value');
    valueEl.textContent = value;
    if (dir) valueEl.classList.add(dir === 'up' ? 'pnl-up' : 'pnl-down');
    return tile;
  }

  function buildStockDetail(r) {
    const item = document.createElement('details');
    item.className = 'acc-item';
    const summary = document.createElement('summary');
    summary.className = 'acc-btn';
    const valColor = (r.pnl || 0) >= 0 ? 'pnl-up' : 'pnl-down';
    summary.innerHTML =
      '<span class="name"></span><span class="quick-val ' + valColor + '"></span>' +
      '<span class="arrow">▶</span>';
    summary.querySelector('.name').textContent = r.name + '（' + r.code + '）';
    summary.querySelector('.quick-val').textContent = fmtMoney(r.pnl) + '　' + fmtPct(r.pr_ratio, 2);
    item.appendChild(summary);

    const grid = document.createElement('div');
    grid.className = 'detail-grid';
    RP_FIELDS.forEach(f => {
      const raw = r[f.key];
      const field = document.createElement('div');
      field.className = 'detail-field';
      field.innerHTML = '<div class="f-label"></div><div class="f-value"></div>';
      field.querySelector('.f-label').textContent = f.label;
      const valueEl = field.querySelector('.f-value');
      valueEl.textContent = f.fmt ? f.fmt(raw) : (raw === null || raw === undefined ? '—' : raw);
      if (f.pnlColor && raw !== null && raw !== undefined) valueEl.classList.add(raw >= 0 ? 'pnl-up' : 'pnl-down');
      grid.appendChild(field);
    });
    item.appendChild(grid);
    return item;
  }

  const sumOf = (recs, k) => recs.reduce((a, r) => a + (r[k] || 0), 0);

  function render() {
    let start = startSel.value, end = endSel.value;
    if (!start || !end) return;
    if (start > end) {
      const tmp = start; start = end; end = tmp;
      startSel.value = start; endSel.value = end;
    }
    const days = acc.days || {};
    const inRange = Object.keys(days).filter(d => d >= start && d <= end).sort();

    let coverSum = 0, entrySum = 0, pnlSum = 0, recordCount = 0;
    const failedDates = [], grossDates = [], activeDays = [];
    inRange.forEach(d => {
      const day = days[d];
      if (day.note) failedDates.push(d);
      if (day.gross) grossDates.push(d);
      const recs = day.records || [];
      if (!recs.length) return;
      coverSum += sumOf(recs, 'cover_cost');
      entrySum += sumOf(recs, 'entry_cost');
      pnlSum += sumOf(recs, 'pnl');
      recordCount += recs.length;
      activeDays.push(d);
    });
    const prRatio = entrySum ? (pnlSum / entrySum * 100) : null;
    const pnlDir = pnlSum >= 0 ? 'up' : 'down';

    const kpiRow = document.getElementById('kpi-row');
    kpiRow.innerHTML = '';
    kpiRow.appendChild(buildTile('賣出筆數', recordCount + ' 筆'));
    kpiRow.appendChild(buildTile('賣出收回總金額', fmtMoney(coverSum)));
    kpiRow.appendChild(buildTile('已實現損益小計', fmtMoney(pnlSum), pnlDir));
    kpiRow.appendChild(buildTile('整體報酬率', fmtPct(prRatio, 2), pnlDir));

    const warnWrap = document.getElementById('warn-wrap');
    warnWrap.innerHTML = '';
    const warns = [];
    const cov = acc.covered;
    if (cov && (start < cov[0] || end > cov[1])) warns.push('⚠️ 查得到的範圍是 ' + cov[0] + ' ～ ' + cov[1] + '，超出的部分沒有資料。');
    if (failedDates.length) warns.push('⚠️ ' + failedDates.join('、') + ' 查詢失敗，當天資料可能不完整，上面的加總沒有算進這幾天。');
    if (grossDates.length) warns.push('ℹ️ ' + grossDates.join('、') + ' 是舊的每日紀錄，收回金額是還沒扣稅費的成交金額，跟其他天口徑略有不同。');
    warns.forEach(w => {
      const banner = document.createElement('div');
      banner.className = 'warn-banner';
      banner.textContent = w;
      warnWrap.appendChild(banner);
    });

    const listEl = document.getElementById('day-list');
    listEl.innerHTML = '';
    if (!activeDays.length) {
      listEl.innerHTML = '<div class="empty-hint">這段期間沒有賣出紀錄</div>';
      return;
    }
    activeDays.slice().reverse().forEach(d => {
      const recs = days[d].records || [];
      const dayPnl = sumOf(recs, 'pnl');
      const item = document.createElement('details');
      item.className = 'acc-item';
      const summary = document.createElement('summary');
      summary.className = 'acc-btn';
      const dayDir = dayPnl >= 0 ? 'pnl-up' : 'pnl-down';
      summary.innerHTML =
        '<span class="name"></span><span class="count"></span>' +
        '<span class="quick-val ' + dayDir + '"></span><span class="arrow">▶</span>';
      summary.querySelector('.name').textContent = d;
      summary.querySelector('.count').textContent = recs.length + ' 筆';
      summary.querySelector('.quick-val').textContent = fmtMoney(sumOf(recs, 'cover_cost')) + '　' + fmtMoney(dayPnl);
      item.appendChild(summary);

      const sublist = document.createElement('div');
      sublist.className = 'acc-sublist';
      recs.slice().sort((a, b) => (b.pnl || 0) - (a.pnl || 0)).forEach(r => sublist.appendChild(buildStockDetail(r)));
      item.appendChild(sublist);
      listEl.appendChild(item);
    });
  }

  // 快速區間：以「查得到的最後一天」往回推
  function quick(q) {
    const cov = acc.covered;
    if (!cov) return;
    const end = cov[1];
    let start = cov[0];
    if (q === 'ytd') start = end.slice(0, 4) + '-01-01';
    else if (q !== 'all') start = iso(T(end) - (+q) * DAY);
    if (start < cov[0]) start = cov[0];
    startSel.value = start; endSel.value = end;
    document.querySelectorAll('#quick-row .quick-btn').forEach(b => b.classList.toggle('is-active', b.dataset.q === q));
    render();
  }

  function selectAccount(key) {
    acc = ACCS.find(a => a.key === key) || ACCS[0];
    bar.querySelectorAll('.acct-btn').forEach(b => b.classList.toggle('is-active', b.dataset.key === acc.key));
    try { localStorage.setItem('ds_account', acc.key); } catch (e) {}
    const cov = acc.covered;
    const n = Object.keys(acc.days || {}).length;
    document.getElementById('hdr-sub').textContent = cov
      ? acc.label + '：查得到 ' + cov[0] + ' ～ ' + cov[1] + '（' + n + ' 天有賣出）'
      : acc.label + '：目前還沒有資料';
    document.getElementById('range-sub').textContent = cov ? '日期可以自己選，或按下面的快速按鈕' : '';
    if (cov) {
      startSel.min = endSel.min = cov[0];
      startSel.max = endSel.max = cov[1];
    }
    let notes = '';
    if (acc.key === 'combined') {
      const each = acc.covered_each || {};
      notes = '合併版把各家同一天的賣出放在一起，名稱後面標是哪一家。' +
        Object.keys(each).map(k => k + '查得到 ' + (each[k] ? each[k][0] + ' ～ ' + each[k][1] : '—')).join('；') + '。';
    } else if (acc.key === 'yuanta') {
      notes = '資料來源：元大 SPARK API「已實現損益查詢」（最多近一年），每天排程更新。';
    } else {
      notes = '資料來源：永豐 Shioaji「已實現損益明細」（list_profit_loss，最多近一年），每筆再查對應的買進批次算出原始成本，每天排程更新。';
    }
    document.getElementById('footnote').innerHTML = notes +
      '<br>三家口徑一致：「原始成本」含買進手續費，「賣出收回金額」是扣掉賣出手續費、證交稅後實際拿回的錢，收回金額 − 原始成本 ＝ 已實現損益。';
    // 換券商時保留目前選的區間，超出範圍就改成全部
    const active = document.querySelector('#quick-row .quick-btn.is-active');
    if (active) quick(active.dataset.q);
    else if (!startSel.value || !endSel.value) quick('30');
    else render();
  }

  if (!ACCS.length) { document.getElementById('hdr-sub').textContent = '目前還沒有資料'; return; }
  if (ACCS.length < 2) bar.remove();
  ACCS.forEach(a => {
    const b = document.createElement('button');
    b.className = 'acct-btn'; b.dataset.key = a.key; b.textContent = a.label;
    b.addEventListener('click', () => selectAccount(a.key));
    bar.appendChild(b);
  });
  document.querySelectorAll('#quick-row .quick-btn').forEach(b => b.addEventListener('click', () => quick(b.dataset.q)));
  const manual = () => { document.querySelectorAll('#quick-row .quick-btn').forEach(b => b.classList.remove('is-active')); render(); };
  startSel.addEventListener('change', manual);
  endSel.addEventListener('change', manual);
  let saved = 'sinopac';
  try { saved = localStorage.getItem('ds_account') || 'sinopac'; } catch (e) {}
  // 預設看近1月
  document.querySelector('#quick-row .quick-btn[data-q="30"]').classList.add('is-active');
  selectAccount(ACCS.some(a => a.key === saved) ? saved : 'sinopac');
})();
</script>
