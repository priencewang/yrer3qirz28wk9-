<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>持股籌碼</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
:root{
  --surface:#f6f5f2;--card:#ffffff;--line:#e4e3df;--ink:#0b0b0b;--ink2:#52514e;--ink3:#8a8984;
  --buy:#e34948;--buy2:#f59a8c;--sell:#16a571;--sell2:#7fd6b0;--track:#efeeea;--buyL:#fcc9c0;--buyD:#a5080f;--sellL:#bfeedb;--sellD:#06734a;--accent:#2a78d6;--hl:#fff4dc;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface:#161615;--card:#21211f;--line:#363633;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#8f8e88;
  --buy:#ef5b5a;--buy2:#a83a37;--sell:#22b77f;--sell2:#14704f;--track:#2c2c29;--buyL:#f4bcb4;--buyD:#e0101a;--sellL:#b4ecd4;--sellD:#08a864;--accent:#5598e7;--hl:#3a3220;}}
:root[data-theme="dark"]{
  --surface:#161615;--card:#21211f;--line:#363633;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#8f8e88;
  --buy:#ef5b5a;--buy2:#a83a37;--sell:#22b77f;--sell2:#14704f;--track:#2c2c29;--buyL:#f4bcb4;--buyD:#e0101a;--sellL:#b4ecd4;--sellD:#08a864;--accent:#5598e7;--hl:#3a3220;}
body{background:var(--surface);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC",sans-serif;font-size:14px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
a.back{font-size:12.5px;color:var(--accent);text-decoration:none}
h1{font-size:21px;margin:6px 0 2px}
.sub{color:var(--ink2);font-size:12.5px;line-height:1.6;margin-bottom:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.legend i{display:inline-block;width:22px;height:8px;border-radius:4px;margin-right:4px;vertical-align:middle}
.toggle{display:inline-flex;background:var(--track);border-radius:999px;padding:3px;margin-left:auto}
#unit-tg,#etf-tg{margin-left:0}
@media (max-width:520px){.axis .scale span:nth-child(3),.axis .scale span:nth-child(5){font-size:0}}
.bigr{font-size:11.5px;color:var(--ink2);margin:-2px 0 4px 18px}.bigr b{color:var(--buy)}
.brd{margin:0 0 8px}.brd summary{cursor:pointer;font-size:12px;color:var(--ink2);padding:2px 0}
.brt{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0 2px}.brt th{font-weight:600;color:var(--ink2);text-align:right;padding:4px 3px;border-bottom:1px solid var(--line);font-size:11px}
.brt th:first-child,.brt td:first-child{text-align:left}.brt td{text-align:right;padding:3px;font-variant-numeric:tabular-nums;white-space:nowrap}.brt td small{color:var(--ink3);margin-left:4px;font-size:10px}
@media (max-width:520px){.brt .hs{display:none}}
.gh{margin:14px 0 2px;font-size:13px;font-weight:700;color:var(--ink)}.gh.s{color:var(--sell)}.gh.b{color:var(--buy)}
.toggle button{border:0;background:transparent;color:var(--ink2);font-family:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.toggle button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 14px}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);position:relative;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tile .no{font-size:11px;color:var(--ink3)}
.tile .ttl{font-size:14.5px;font-weight:700;margin:2px 0 4px}
.tile .cnt{font-size:22px;font-weight:800;letter-spacing:-.5px}
.tile .cnt small{font-size:12px;font-weight:400;color:var(--ink3);margin-left:2px}
.tile .mini{position:absolute;right:10px;top:10px;width:46px;height:6px;border-radius:3px;overflow:hidden;display:flex;background:var(--track)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px}
.ph{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.ph h2{font-size:17px;margin:0}
.ph p{margin:3px 0 0;color:var(--ink2);font-size:12.5px;line-height:1.55;flex-basis:100%}
.subt{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.subt button{border:1px solid var(--line);background:transparent;color:var(--ink2);font-family:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.subt button.on{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:700}
.axis{position:sticky;top:0;background:var(--card);z-index:2;display:grid;grid-template-columns:var(--lw) 1fr;padding:8px 0 4px;border-bottom:1px solid var(--line)}
.axis .scale{position:relative;height:34px;margin:0 10px}
.axis .band{position:absolute;left:0;right:0;top:20px;height:8px;border-radius:999px}
.axis .scale span{position:absolute;top:0;transform:translateX(-50%);font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.axis .scale span.p{color:var(--buy)}.axis .scale span:last-child{transform:translateX(-90%)}.axis .scale span:nth-child(2)::after,.axis .scale span:last-child::after{display:none}.axis .scale span.n{color:var(--sell)}
.axis .scale span::after{content:"";position:absolute;left:50%;top:17px;width:2px;margin-left:-1px;height:14px;border-radius:1px;background:var(--card)}
.axis .lab{font-size:11px;color:var(--ink3);align-self:center}
.nm .src{font-style:normal;margin-left:4px;padding:0 5px;border-radius:6px;border:1px solid var(--accent);color:var(--accent);font-size:10px}
.axis .lab b{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--track);color:var(--ink);font-size:11.5px;margin-bottom:2px}
.row{display:grid;grid-template-columns:var(--lw) 1fr;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.nm{min-width:0;padding-right:6px}
.nm b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-size:11px;color:var(--ink3)}
.bars{margin:0 10px;display:flex;flex-direction:column;gap:5px}
.bar{position:relative;height:20px}
.bar .trk{position:absolute;inset:4px 0;border-radius:999px;background:var(--track);box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
.bar .zero{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--ink3);opacity:.55;border-radius:1px}
.bar .fill{position:absolute;top:4px;height:12px;border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1),left .5s cubic-bezier(.2,.8,.2,1)}
.bar .fill.buy{background:linear-gradient(90deg,var(--buyL),var(--e))}
.bar .fill.sell{background:linear-gradient(270deg,var(--sellL),var(--e))}
.bar .bulb{position:absolute;top:4px;width:12px;height:12px;border-radius:50%;background:var(--e)}
.bar .val{position:absolute;top:0;font-size:12.5px;font-weight:800;white-space:nowrap;line-height:20px}
.bar .tag{position:absolute;left:-2px;top:0;font-size:10px;color:var(--ink3);transform:translateX(-100%);padding-right:4px;line-height:20px}
.detail{grid-column:1/-1;margin:6px 0 4px;padding:10px;border-radius:12px;background:var(--track)}
.detail .dt{font-size:12px;color:var(--ink2);margin-bottom:6px}
.spark{display:grid;grid-template-columns:44px 1fr 1fr;}
.spark.dl{grid-template-columns:40px 1fr 1fr 1fr}
.spark.dl{gap:4px 6px}.spark.dl .cell b{font-size:10px}
.dlbtn{font:inherit;font-size:11.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer;margin:0 0 8px}
.dlbtn.on{color:var(--ink);border-color:var(--ink3)}
.flowsum{font-size:12px;color:var(--ink2);margin:0 0 8px;line-height:1.6}
.spark{gap:4px 10px;align-items:center;font-size:11px;color:var(--ink3)}
.spark .h{font-size:11px;color:var(--ink2);text-align:center;padding-bottom:2px;border-bottom:1px solid var(--line)}
.spark .h:first-child{text-align:left}
.spark .cell{height:20px;position:relative}
.spark .cell .z{position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:var(--ink3);opacity:.5}
.spark .cell i{position:absolute;top:5px;height:10px;border-radius:3px}
.spark .cell b{position:absolute;top:0;line-height:20px;font-size:11px;font-weight:700;white-space:nowrap}
.spark .d{text-align:left;color:var(--ink2)}
.empty{padding:24px 6px;text-align:center;color:var(--ink3)}
.ai{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:linear-gradient(180deg,var(--hl),transparent 70%)}
.ai .rk{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--card);font-weight:800;align-items:center;justify-content:center;margin-right:8px}
.ai .hd{display:flex;align-items:center;font-size:15px;font-weight:700}
.ai .hd small{font-weight:400;color:var(--ink3);margin-left:6px;font-size:12px}
.ai p{margin:8px 0 6px;line-height:1.65;color:var(--ink2);font-size:13.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.chip.b{color:var(--buy);border-color:var(--buy)}
.chip.s{color:var(--sell);border-color:var(--sell)}
.note{font-size:11.5px;color:var(--ink3);line-height:1.6;margin-top:12px}
</style></head><body>

      SQ = true;
      const m = niceMax(Math.max(...ms.map(s => Math.max(brLast(s.code).v.b5, -brLast(s.code).v.s5))));
      html += axisHtml(-m, m, '張', lw) + ms.map(s => { const {d, v} = brLast(s.code), t1 = v.b[0], t2 = v.s[0];
        return rowHtml(s, `<div class="bars">${bar(v.b5, -m, m, '買', sg(v.b5))}${bar(v.s5, -m, m, '賣', sg(v.s5))}<div class="bigr">${md(d)} 前5大分點合計${t1 ? '｜最大買 <b>' + t1[1] + '</b>' : ''}${t2 ? '｜最大賣 <b style="color:var(--sell)">' + t2[1] + '</b>' : ''}</div></div>`); }).join('');
    }
  } else if (c.kind === 'bank8') {
    if (!B8) html += `<div class="empty">還沒有八大行庫的資料（每天晚上AI上網搜新聞整理；新聞通常傍晚以後才出來）。${DATA.bank8 && DATA.bank8.note ? '<br>' + DATA.bank8.note : ''}</div>`;
    else {
      SQ = true;
      const G = ms, all = G.b.concat(G.s), m = niceMax(Math.max(1, ...all.map(x => Math.abs(x.v))));
      if (B8.stopped) html += `<div class="empty" style="margin-bottom:6px">🛑 國安基金 ${(B8.nsf_exit || {}).date || ''} 宣布退場，八大行庫已停止每天搜尋，下面是最後一天的資料。</div>`;
      html += `<p style="color:var(--ink2);font-size:12.5px;margin:6px 0 0;line-height:1.6">${B8.date === DATA.date ? '' : '⚠️ 這是 ' + B8.date + ' 的資料，'}${B8.total != null ? `八大行庫合計 <b style="color:${B8.total >= 0 ? 'var(--buy)' : 'var(--sell)'}">${B8.total >= 0 ? '買超' : '賣超'} ${Math.abs(B8.total)} 億</b>。` : '新聞沒寫合計金額。'}${B8.summary || ''}<br><span style="font-size:11px;color:var(--ink3)">來源：${(B8.sources || []).map(x => `<a href="${x.url}" target="_blank" rel="noopener" style="color:var(--accent)">${x.title || '新聞'}</a>`).join('、') || '—'}</span></p>`;
      html += axisHtml(-m, m, '張', lw) + [['買超', 'b', G.b], ['賣超', 's', G.s]].map(([h, k, list]) => `<div class="gh ${k}">${h}</div>` + (list.length ? list.map(x => rowHtml(x.s, `<div class="bars">${bar(x.v, -m, m, '', sg(x.v) + '張')}</div>`)).join('') : '<div class="empty">沒有</div>')).join('');
    }
  } else if (c.kind === 'ai') {
    const A = DATA.ai;
    if (!A || !A.picks || !A.picks.length) html += `<div class="empty">AI還沒產出今天的分析（每天17:30抓完籌碼後跑一次）。</div>`;
    else {
      html += `<p style="color:var(--ink2);font-size:12.5px;margin:6px 0 0">${A.date === DATA.date ? '' : '⚠️ 這份是 ' + A.date + ' 的資料分析的，'}只根據外資、投信籌碼（今天、近5日、連續天數），不看新聞跟基本面，請當參考。${A.summary ? '<br>' + A.summary : ''}</p>`;
      A.picks.forEach((p, i) => {
        const s = DATA.stocks.find(x => x.code === p.code) || {};
        const sk = (n, cap, w) => n ? `<span class="chip ${n > 0 ? 'b' : 's'}">${w}連${dayTxt(n, cap)}${n > 0 ? '買' : '賣'}</span>` : '';
        html += `<div class="ai"><div class="hd"><span class="rk">${i + 1}</span>${p.name || s.name}<small>${p.code}</small></div><p>${p.reason}</p>
          <div class="chips"><span class="chip ${s.f >= 0 ? 'b' : 's'}">外資今天 ${sg(s.f || 0)}張</span><span class="chip ${s.t >= 0 ? 'b' : 's'}">投信今天 ${sg(s.t || 0)}張</span>${sk(s.fs, s.fcap, '外資')}${sk(s.ts, s.tcap, '投信')}</div></div>`;
      });
    }
  } else if ((mkt || c.kind === 'retail') ? !(ms.b.length + ms.s.length) : !ms.length) html += `<div class="empty">${c.kind === 'retail' && !ED.margin ? '還沒有融資資料。' : '今天沒有符合的股票。'}</div>`;
  else {
    // 全市場模式分兩段(買在上、賣在下)，共用一把刻度尺
    const groups = c.kind === 'retail' ? [[c.gs, 'b', ms.s], [c.gb, 's', ms.b]] : mkt ? [[c.gb, 'b', ms.b], [c.gs, c.kind === 'big' ? 'b' : 's', ms.s]] : [[null, '', ms]];
    const all = groups.flatMap(g => g[2]);
    let m, ax;
    if (c.kind === 'pair') { m = niceMax(Math.max(...all.flatMap(s => [Math.abs(V(s,'f')), Math.abs(V(s,'t'))]))); ax = axisHtml(-m, m, '張', lw); }
    else if (c.kind === 'one') { m = niceMax(Math.max(...all.map(s => Math.abs(V(s, c.key))))); ax = axisHtml(-m, m, '張', lw); }
    else if (c.kind === 'flow') { m = niceMax(Math.max(...all.map(s => Math.abs(FL(s))))); ax = axisHtml(-m, m, '元', lw); }
    else if (c.kind === 'retail') { SQ = true; m = niceMax(Math.max(1, ...all.flatMap(s => [Math.abs(FT(s)), Math.abs(FC(s) || 0)]))); ax = axisHtml(-m, m, '張', lw); }
    else if (c.kind === 'big') { m = niceMax(Math.max(...all.map(s => bigAmt(s, mkt ? 10 : sv)))); ax = axisHtml(0, m, '元', lw); }
    else { m = niceMax(Math.max(10, ...all.map(s => Math.abs(s[c.key])))); ax = axisHtml(-m, m, '天', lw); }
    const row = (s, gi) => {
      if (c.kind === 'pair') return rowHtml(s, `<div class="bars">${bar(V(s,'f'), -m, m, '外', fv(V(s,'f')))}${bar(V(s,'t'), -m, m, '投', fv(V(s,'t')))}</div>`);
      if (c.kind === 'one') {
        // 今天的量是幾天內最大(只在「今日」顯示，5天以上才標)
        const r = c.key === 'f' ? s.fr : s.tr, rc = c.key === 'f' ? s.frc : s.trc;
        const rt = P === '1' && Math.abs(r) >= 5 ? `・${rc ? '≥' : ''}${Math.abs(r)}日內最大` : '';
        return rowHtml(s, `<div class="bars">${bar(V(s, c.key), -m, m, '', fv(V(s, c.key)) + rt)}</div>`);
      }
      if (c.kind === 'big') {
        // 只畫達標的那一家；全市場模式外資段只畫外資、投信段只畫投信
        const hits = bigHit(s, mkt ? 10 : sv).filter(x => !mkt || x[0] === (gi === 0 ? 'f' : 't'));
        return rowHtml(s, `<div class="bars">${hits.map(([k, r, rc]) => { const a = q(s, '1')[k + 'a'] || 0;
          return bar(a, 0, m, k === 'f' ? '外' : '投', fvA(a)) + `<div class="bigr">${k === 'f' ? '外資' : '投信'}買超金額 <b>${rc ? '≥' : ''}${r}日內最大</b></div>`; }).join('')}</div>`);
      }
      if (c.kind === 'flow') return rowHtml(s, `<div class="bars">${bar(FL(s), -m, m, '', fvA(FL(s)))}</div>`);
      if (c.kind === 'retail') return rowHtml(s, `<div class="bars">${bar(FT(s), -m, m, '法人', fvu(FT(s)))}${bar(FC(s), -m, m, '融資', fvu(FC(s) || 0))}${xLine(s)}</div>`);
      const n = s[c.key];
      const today = c.amt === 'both' ? `今天外${fvu(V1(s, 'f'))}／投${fvu(V1(s, 't'))}` : `今天${fvu(V1(s, c.amt))}`;
      return rowHtml(s, `<div class="bars">${bar(n, -m, m, '', `連${dayTxt(n, s[c.cap])}${n > 0 ? '買' : '賣'}・${today}`)}</div>`);
    };
    html += ax + groups.map(([h, k, list], gi) => (h ? `<div class="gh ${k}">${h}</div>` : '') + (list.length ? list.map(x => row(x, gi)).join('') : '<div class="empty">沒有</div>')).join('');
  }
  $('panel').innerHTML = html;
  $('panel').querySelectorAll('.subt button').forEach(b => b.onclick = () => { sub[c.id] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; st('chip_sub', JSON.stringify(sub)); renderGrid(); renderPanel(); });
  $('panel').querySelectorAll('.dlbtn').forEach(b => b.onclick = e => { e.stopPropagation(); showDl = !showDl; renderPanel(); });
  $('panel').querySelectorAll('.row').forEach(r => r.onclick = () => { openCode = openCode === r.dataset.code ? null : r.dataset.code; renderPanel(); });
  if (scroll && window.innerWidth < 720) $('panel').scrollIntoView({behavior: 'smooth', block: 'start'});
}
$('etf-tg').querySelectorAll('button').forEach(b => { b.classList.toggle('on', (b.dataset.v === '1') === withEtf);
  b.onclick = () => { withEtf = b.dataset.v === '1'; st('chip_etf', withEtf ? '1' : '0'); $('etf-tg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); renderGrid(); renderPanel(); }; });
function setupTg(id, get, set){
  const bs = $(id).querySelectorAll('button');
  bs.forEach(b => { b.classList.toggle('on', b.dataset.v === get());
    b.onclick = () => { set(b.dataset.v); bs.forEach(x => x.classList.toggle('on', x === b)); openCode = null; refresh(); }; });
}
function refresh(){
  $('etf-tg').style.display = scope === 'mkt' ? 'none' : '';
  renderGrid(); renderPanel();
}
if (!MK) $('scope-tg').style.display = 'none';
setupTg('scope-tg', () => scope, v => { scope = v; st('chip_scope', v); });
setupTg('unit-tg', () => U, v => { U = v; st('chip_unit', v); });
$('per-tg').innerHTML = PERS.map(p => `<button data-v="${p}">${p === '1' ? '今日' : p + '日'}</button>`).join('');
setupTg('per-tg', () => P, v => { P = v; st('chip_per', v); });
$('etf-tg').style.display = scope === 'mkt' ? 'none' : '';
$('sub').innerHTML = `籌碼日期 <b>${DATA.date}</b>（三大法人日報）｜持股 ${DATA.stocks.filter(s => (s.src || '持股') === '持股').length} 檔（永豐＋元大）＋長線標的/鎖股觀察 ${DATA.stocks.filter(s => s.src && s.src !== '持股').length} 檔｜只看外資（不含外資自營商）跟投信`;
$('note').innerHTML = `• 資料來源：證交所「三大法人買賣超日報」、櫃買中心「三大法人買賣明細」，最晚傍晚6點前公布完，每天17:30排程抓一次（還沒齊會每10分鐘重抓，到18:30左右）。更新時間 ${DATA.updated}。<br>
  • 連續天數最多往回算 ${DATA.days} 個交易日，碰到上限的會顯示「≥」。今天沒有買賣（0張）就算中斷。<br>
  • 1張＝1,000股；零股成交的ETF可能顯示小數。<br>
  • 「金額」＝今天買賣超股數×當天收盤價（估算，${DATA.price_date || '—'}收盤）；沒成交的股票算0。<br>
  • 「資金流向」＝外資＋投信＋自營商三大法人的買賣超金額合計（每天股數×當天收盤價，區間就逐日加總）。自營商<b>含避險</b>部位（券商發權證後被動買賣來對沖，不太代表看法），跟官方「三大法人合計」一致；自營商只算進資金流向，其他格子不顯示。<br>
  • 區間「2日／3日…」＝最近N個交易日加總；「N日內最大」＝今天的買（賣）超往前找，碰到比它大的那天才停（歷史最多${DATA.days}個交易日）。<br>
  • 「大量買超區」＝外資或投信今天的買超<b>金額</b>（股數×收盤價）往前找，是最近10日（或20、60日）內最大的一天；超過的會直接寫幾日。只看今天，不跟區間按鈕走。<br>
  • 「分點進出」＝證交所／櫃買中心官網的券商買賣日報表，網站有驗證碼不能用程式抓，要你自己查、下載CSV丟進「分點CSV」資料夾才會有。淨張數＝買進−賣出；均價＝淨買的分點看買進均價、淨賣的看賣出均價。<br>
  • 「散戶動向」與點開股票的融資／借券／當沖／集保：三大法人只佔成交約一半，這些補「其他人」的動向。融資＝散戶借錢買、融券＝放空；借券賣出＝法人借股票來賣（三大法人買賣超看不到）；當沖％高的爆量多半是短線在洗；集保大戶＝持股400張以上的人佔總股數％（每週五資料，週末公布）。融資、借券晚上9點多才公布，17:30看到的是前一天，21:30會再更新一次。${ED.dtmk && ED.dtmk.twse ? `${md(ED.dt)} 上市當沖佔成交張數 ${ED.dtmk.twse[0]}%、上櫃 ${ED.dtmk.tpex ? ED.dtmk.tpex[0] : '—'}%。` : ''}<br>
  • 「八大行庫」＝新聞整理的官股券商分點買賣超，不是官方統計；每天晚上AI上網搜當天新聞，找不到就留空。<br>
  • 「全市場前5」＝上市上櫃全部個股（4碼、不含ETF／權證／特別股），張數跟金額排出來的名單不一樣（低價股張數容易很大）。`;
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => renderPanel(), 200); });
renderGrid(); renderPanel();
</script></body></html>
