<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>持股籌碼</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
:root{
  --surface:#f6f5f2;--card:#ffffff;--line:#e4e3df;--ink:#0b0b0b;--ink2:#52514e;--ink3:#8a8984;
  --buy:#e34948;--buy2:#f59a8c;--sell:#16a571;--sell2:#7fd6b0;--track:#efeeea;--buyL:#fcc9c0;--buyD:#a5080f;--sellL:#bfeedb;--sellD:#06734a;--accent:#2a78d6;--hl:#fff4dc;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface:#161615;--card:#21211f;--line:#363633;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#8f8e88;
  --buy:#ef5b5a;--buy2:#a83a37;--sell:#22b77f;--sell2:#14704f;--track:#2c2c29;--buyL:#f4bcb4;--buyD:#e0101a;--sellL:#b4ecd4;--sellD:#08a864;--accent:#5598e7;--hl:#3a3220;}}
:root[data-theme="dark"]{
  --surface:#161615;--card:#21211f;--line:#363633;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#8f8e88;
  --buy:#ef5b5a;--buy2:#a83a37;--sell:#22b77f;--sell2:#14704f;--track:#2c2c29;--buyL:#f4bcb4;--buyD:#e0101a;--sellL:#b4ecd4;--sellD:#08a864;--accent:#5598e7;--hl:#3a3220;}
body{background:var(--surface);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC",sans-serif;font-size:14px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
a.back{font-size:12.5px;color:var(--accent);text-decoration:none}
h1{font-size:21px;margin:6px 0 2px}
.sub{color:var(--ink2);font-size:12.5px;line-height:1.6;margin-bottom:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.legend i{display:inline-block;width:22px;height:8px;border-radius:4px;margin-right:4px;vertical-align:middle}
.toggle{display:inline-flex;background:var(--track);border-radius:999px;padding:3px;margin-left:auto}
.toggle button{border:0;background:transparent;color:var(--ink2);font-family:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.toggle button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 14px}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);position:relative;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tile .no{font-size:11px;color:var(--ink3)}
.tile .ttl{font-size:14.5px;font-weight:700;margin:2px 0 4px}
.tile .cnt{font-size:22px;font-weight:800;letter-spacing:-.5px}
.tile .cnt small{font-size:12px;font-weight:400;color:var(--ink3);margin-left:2px}
.tile .mini{position:absolute;right:10px;top:10px;width:46px;height:6px;border-radius:3px;overflow:hidden;display:flex;background:var(--track)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px}
.ph{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.ph h2{font-size:17px;margin:0}
.ph p{margin:3px 0 0;color:var(--ink2);font-size:12.5px;line-height:1.55;flex-basis:100%}
.subt{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.subt button{border:1px solid var(--line);background:transparent;color:var(--ink2);font-family:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.subt button.on{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:700}
.axis{position:sticky;top:0;background:var(--card);z-index:2;display:grid;grid-template-columns:var(--lw) 1fr;padding:8px 0 4px;border-bottom:1px solid var(--line)}
.axis .scale{position:relative;height:34px;margin:0 10px}
.axis .band{position:absolute;left:0;right:0;top:20px;height:8px;border-radius:999px}
.axis .scale span{position:absolute;top:0;transform:translateX(-50%);font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.axis .scale span.p{color:var(--buy)}.axis .scale span:last-child{transform:translateX(-90%)}.axis .scale span.n{color:var(--sell)}
.axis .scale span::after{content:"";position:absolute;left:50%;top:17px;width:2px;margin-left:-1px;height:14px;border-radius:1px;background:var(--card)}
.axis .lab{font-size:11px;color:var(--ink3);align-self:center}
.axis .lab b{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--track);color:var(--ink);font-size:11.5px;margin-bottom:2px}
.row{display:grid;grid-template-columns:var(--lw) 1fr;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.nm{min-width:0;padding-right:6px}
.nm b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-size:11px;color:var(--ink3)}
.bars{margin:0 10px;display:flex;flex-direction:column;gap:5px}
.bar{position:relative;height:20px}
.bar .trk{position:absolute;inset:4px 0;border-radius:999px;background:var(--track);box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
.bar .zero{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--ink3);opacity:.55;border-radius:1px}
.bar .fill{position:absolute;top:4px;height:12px;border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1),left .5s cubic-bezier(.2,.8,.2,1)}
.bar .fill.buy{background:linear-gradient(90deg,var(--buyL),var(--e))}
.bar .fill.sell{background:linear-gradient(270deg,var(--sellL),var(--e))}
.bar .bulb{position:absolute;top:1px;width:18px;height:18px;border-radius:50%;border:2px solid var(--card);background:var(--e);box-shadow:0 0 0 calc(1px + var(--g)) color-mix(in srgb,var(--e) 30%,transparent)}
.bar .val{position:absolute;top:0;font-size:12.5px;font-weight:800;white-space:nowrap;line-height:20px}
.bar .tag{position:absolute;left:-2px;top:0;font-size:10px;color:var(--ink3);transform:translateX(-100%);padding-right:4px;line-height:20px}
.detail{grid-column:1/-1;margin:6px 0 4px;padding:10px;border-radius:12px;background:var(--track)}
.detail .dt{font-size:12px;color:var(--ink2);margin-bottom:6px}
.spark{display:grid;grid-template-columns:28px repeat(10,1fr);gap:3px;align-items:center;font-size:10.5px;color:var(--ink3)}
.spark .cell{height:30px;position:relative}
.spark .cell i{position:absolute;left:15%;right:15%;border-radius:3px}
.spark .d{text-align:center}
.empty{padding:24px 6px;text-align:center;color:var(--ink3)}
.ai{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:linear-gradient(180deg,var(--hl),transparent 70%)}
.ai .rk{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--card);font-weight:800;align-items:center;justify-content:center;margin-right:8px}
.ai .hd{display:flex;align-items:center;font-size:15px;font-weight:700}
.ai .hd small{font-weight:400;color:var(--ink3);margin-left:6px;font-size:12px}
.ai p{margin:8px 0 6px;line-height:1.65;color:var(--ink2);font-size:13.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.chip.b{color:var(--buy);border-color:var(--buy)}
.chip.s{color:var(--sell);border-color:var(--sell)}
.note{font-size:11.5px;color:var(--ink3);line-height:1.6;margin-top:12px}
</style></head><body>

<script>
const DATA = JSON.parse(document.getElementById('chips-data').textContent);
const $ = id => document.getElementById(id);
const st = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
let cat = st('chip_cat') || 'both_buy', withEtf = st('chip_etf') === '1', sub = {};
try { sub = JSON.parse(st('chip_sub') || '{}'); } catch (e) {}
let openCode = null;
const nf = v => { const a = Math.abs(v); return (a >= 100 ? Math.round(a).toLocaleString('zh-TW') : a.toLocaleString('zh-TW', {maximumFractionDigits: 1})); };
const sg = v => (v > 0 ? '+' : v < 0 ? '−' : '') + nf(v);
const dayTxt = (n, cap) => `${cap ? '≥' : ''}${Math.abs(n)}`;
const md = s => +s.slice(5, 7) + '/' + +s.slice(8, 10);

// 類別定義：pick＝誰入選、sort＝排序值(高→低)、kind＝畫法
const CATS = [
  {id:'both_buy', no:1, t:'同買', d:'外資、投信今天都買超。依兩者合計由高到低。', pick:s => s.f > 0 && s.t > 0, sort:s => s.f + s.t, kind:'pair'},
  {id:'both_sell', no:2, t:'同賣', d:'外資、投信今天都賣超。依兩者合計賣最多的排前面。', pick:s => s.f < 0 && s.t < 0, sort:s => -(s.f + s.t), kind:'pair'},
  {id:'fight', no:3, t:'土洋對作', d:'外資跟投信方向相反（一個買、一個賣）。依兩者合計由高到低。', pick:s => s.f * s.t < 0, sort:s => s.f + s.t, kind:'pair'},
  {id:'trust', no:4, t:'投信買賣超', d:'只看投信，今天有買賣的股票，買超由高到低、賣超排在下面。', pick:s => s.t !== 0, sort:s => s.t, kind:'one', key:'t'},
  {id:'foreign', no:5, t:'外資買賣超', d:'只看外資（不含外資自營商），今天有買賣的股票，買超由高到低。', pick:s => s.f !== 0, sort:s => s.f, kind:'one', key:'f'},
  {id:'f_streak', no:6, t:'外資連買', d:'外資連續買超的天數（今天也要是買超才算）。', kind:'streak', key:'fs', cap:'fcap', amt:'f', subs:[3,5,10]},
  {id:'f_10', no:7, t:'外資連續10日↑', d:'外資連續買超或連續賣超達10個交易日以上，秀出實際天數。', kind:'streak10', key:'fs', cap:'fcap', amt:'f'},
  {id:'t_streak', no:8, t:'投信連買／10日↑', d:'投信連續買超天數；最後一個按鈕是連續買或賣10日以上（秀天數）。', kind:'streak', key:'ts', cap:'tcap', amt:'t', subs:[3,5,10,'10b']},
  {id:'ai', no:9, t:'AI 籌碼前五名', d:'', kind:'ai'},
];
const pool = () => DATA.stocks.filter(s => withEtf || !s.etf);
function members(c, sv){
  const P = pool();
  if (c.kind === 'pair' || c.kind === 'one') return P.filter(c.pick).sort((a, b) => c.sort(b) - c.sort(a));
  if (c.kind === 'streak10' || (c.kind === 'streak' && sv === '10b'))
    return P.filter(s => Math.abs(s[c.key]) >= 10).sort((a, b) => b[c.key] - a[c.key] || b[c.amt] - a[c.amt]);
  if (c.kind === 'streak') return P.filter(s => s[c.key] >= (sv || 3)).sort((a, b) => b[c.key] - a[c.key] || b[c.amt] - a[c.amt]);
  if (c.kind === 'ai') return (DATA.ai && DATA.ai.picks || []).map(p => DATA.stocks.find(s => s.code === p.code)).filter(Boolean);
  return [];
}
const subOf = c => c.subs ? (sub[c.id] ?? c.subs[0]) : null;

function niceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }

function renderGrid(){
  $('grid').innerHTML = CATS.map(c => {
    const ms = members(c, subOf(c)), n = ms.length;
    let mini = '';
    if (c.kind === 'pair') {
      const b = ms.reduce((a, s) => a + Math.max(0, s.f) + Math.max(0, s.t), 0), x = ms.reduce((a, s) => a - Math.min(0, s.f) - Math.min(0, s.t), 0);
      if (b + x) mini = `<span class="mini"><i style="width:${b/(b+x)*100}%;background:var(--buy)"></i><i style="flex:1;background:var(--sell)"></i></span>`;
    } else if (c.kind === 'one') {
      const b = ms.filter(s => s[c.key] > 0).length;
      if (n) mini = `<span class="mini"><i style="width:${b/n*100}%;background:var(--buy)"></i><i style="flex:1;background:var(--sell)"></i></span>`;
    }
    const unit = c.kind === 'ai' ? '檔' : '檔';
    return `<button class="tile${c.id === cat ? ' on' : ''}" data-id="${c.id}">${mini}<div class="no">${c.no}</div><div class="ttl">${c.t}</div><div class="cnt">${n}<small>${unit}</small></div></button>`;
  }).join('');
  $('grid').querySelectorAll('.tile').forEach(b => b.onclick = () => { cat = b.dataset.id; st('chip_cat', cat); openCode = null; renderGrid(); renderPanel(true); });
}

// 一條溫度計：v值，axis[lo,hi]；lo<0代表左右對稱(0在中間)
// 張數用「開根號刻度」(2026/11/21：友達外資2.9萬張會把其他幾百張的壓扁看不到)；天數用一般刻度
let SQ = false;
const tf = x => SQ ? Math.sign(x) * Math.sqrt(Math.abs(x)) : x;
function bar(v, lo, hi, tag, label){
  const pos = x => (tf(x) - tf(lo)) / (tf(hi) - tf(lo)) * 100, z = pos(0), p = pos(Math.max(lo, Math.min(hi, v)));
  const buy = v >= 0, l = Math.min(z, p), w = Math.abs(p - z);
  const r = Math.min(1, w / Math.max(1, buy ? 100 - z : z));   // 佔這一側的比例，越長越深
  const L = buy ? 'var(--buyL)' : 'var(--sellL)', D = buy ? 'var(--buyD)' : 'var(--sellD)';
  const e = `color-mix(in srgb,${D} ${Math.round(15 + 85 * r)}%,${L})`;
  const col = `color-mix(in srgb,${D} ${Math.round(60 + 40 * r)}%,${L})`;   // 數字顏色：太淡看不清，最少60%
  const valPos = buy ? `left:calc(${p}% + 10px)` : `right:calc(${100 - p}% + 10px)`;
  const flip = buy ? p > 78 : p < 22;   // 太靠邊就把數字放進條裡面那側
  // 太靠邊放不下：數字改放到0線的另一側
  const vp = flip ? (buy ? `right:calc(${100 - z}% + 8px)` : `left:calc(${z}% + 8px)`) : valPos;
  return `<div class="bar" style="--e:${e};--g:${Math.round(r * 4)}px">${tag ? `<span class="tag">${tag}</span>` : ''}<div class="trk"></div>
    <div class="fill ${buy ? 'buy' : 'sell'}" style="left:${l}%;width:${w}%"></div>
    ${v ? `<div class="bulb" style="left:calc(${p}% - 9px)"></div>` : ''}
    <div class="zero" style="left:calc(${z}% - 1px)"></div>
    <span class="val" style="${vp};color:${col}">${label}</span></div>`;
}
function axisHtml(lo, hi, unit, lw){
  const ticks = SQ ? [lo, lo / 4, 0, hi / 4, hi] : lo < 0 ? [lo, lo / 2, 0, hi / 2, hi] : [0, hi / 4, hi / 2, hi * 3 / 4, hi];
  const fmtT = v => (unit === '天' ? Math.round(Math.abs(v)) : nf(v)) + (v === 0 ? '' : '');
  const z = (tf(0) - tf(lo)) / (tf(hi) - tf(lo)) * 100;
  const band = lo < 0 ? `var(--sellD) 0%,var(--sellL) ${z}%,var(--buyL) ${z}%,var(--buyD) 100%` : `var(--buyL) 0%,var(--buyD) 100%`;
  return `<div class="axis" style="--lw:${lw}"><div class="lab">${unit === '天' ? '<b>連續天數</b>' : '<b>單位：張</b><br><span style="font-size:9.5px">刻度開根號</span>'}</div><div class="scale"><div class="band" style="background:linear-gradient(90deg,${band})"></div>${ticks.map(t => `<span class="${t > 0 ? 'p' : t < 0 ? 'n' : ''}" style="left:${(tf(t) - tf(lo)) / (tf(hi) - tf(lo)) * 100}%">${t < 0 ? (unit === '天' ? '賣' : '−') : t > 0 && lo < 0 ? (unit === '天' ? '買' : '+') : ''}${fmtT(t)}</span>`).join('')}</div></div>`;
}
function detail(s){
  const mx = Math.max(1, ...s.f10.map(Math.abs), ...s.t10.map(Math.abs));
  const line = (arr, lab) => `<div>${lab}</div>` + arr.map(v => { const h = Math.abs(v) / mx * 50; return `<div class="cell"><i style="${v >= 0 ? 'bottom:50%' : 'top:50%'};height:${h}%;background:${v >= 0 ? 'var(--buy)' : 'var(--sell)'}"></i></div>`; }).join('');
  const sk = (n, cap) => n > 0 ? `連${dayTxt(n, cap)}買` : n < 0 ? `連${dayTxt(n, cap)}賣` : '今天沒買賣';
  return `<div class="detail"><div class="dt">近5日合計　外資 <b style="color:${s.f5 >= 0 ? 'var(--buy)' : 'var(--sell)'}">${sg(s.f5)}</b> 張（${sk(s.fs, s.fcap)}）｜投信 <b style="color:${s.t5 >= 0 ? 'var(--buy)' : 'var(--sell)'}">${sg(s.t5)}</b> 張（${sk(s.ts, s.tcap)}）</div>
    <div class="spark">${line(s.f10, '外資')}${line(s.t10, '投信')}<div></div>${DATA.dates10.map(d => `<div class="d">${md(d)}</div>`).join('')}</div></div>`;
}
function rowHtml(s, inner){
  return `<div class="row" data-code="${s.code}"><div class="nm"><b>${s.name}</b><small>${s.code}${s.etf ? '・ETF' : ''}</small></div>${inner}${openCode === s.code ? detail(s) : ''}</div>`;
}
function renderPanel(scroll){
  const c = CATS.find(x => x.id === cat) || CATS[0], sv = subOf(c), ms = members(c, sv);
  const lw = window.innerWidth < 520 ? '92px' : '150px';
  SQ = c.kind === 'pair' || c.kind === 'one';
  $('panel').style.setProperty('--lw', lw);
  let html = `<div class="ph"><h2>${c.no}．${c.t}</h2><p>${c.d}</p></div>`;
  if (c.subs) html += `<div class="subt">${c.subs.map(v => `<button data-v="${v}" class="${String(v) === String(sv) ? 'on' : ''}">${v === '10b' ? '連續10日↑（買／賣）' : '連買' + v + '日↑'}</button>`).join('')}</div>`;
  if (c.kind === 'ai') {
    const A = DATA.ai;
    if (!A || !A.picks || !A.picks.length) html += `<div class="empty">AI還沒產出今天的分析（每天15:30後、晚上9:30補資料後各跑一次）。</div>`;
    else {
      html += `<p style="color:var(--ink2);font-size:12.5px;margin:6px 0 0">${A.date === DATA.date ? '' : '⚠️ 這份是 ' + A.date + ' 的資料分析的，'}只根據外資、投信籌碼（今天、近5日、連續天數），不看新聞跟基本面，請當參考。${A.summary ? '<br>' + A.summary : ''}</p>`;
      A.picks.forEach((p, i) => {
        const s = DATA.stocks.find(x => x.code === p.code) || {};
        const sk = (n, cap, w) => n ? `<span class="chip ${n > 0 ? 'b' : 's'}">${w}連${dayTxt(n, cap)}${n > 0 ? '買' : '賣'}</span>` : '';
        html += `<div class="ai"><div class="hd"><span class="rk">${i + 1}</span>${p.name || s.name}<small>${p.code}</small></div><p>${p.reason}</p>
          <div class="chips"><span class="chip ${s.f >= 0 ? 'b' : 's'}">外資今天 ${sg(s.f || 0)}張</span><span class="chip ${s.t >= 0 ? 'b' : 's'}">投信今天 ${sg(s.t || 0)}張</span>${sk(s.fs, s.fcap, '外資')}${sk(s.ts, s.tcap, '投信')}</div></div>`;
      });
    }
  } else if (!ms.length) html += `<div class="empty">今天沒有符合的股票。</div>`;
  else if (c.kind === 'pair') {
    const m = niceMax(Math.max(...ms.flatMap(s => [Math.abs(s.f), Math.abs(s.t)])));
    html += axisHtml(-m, m, '張', lw) + ms.map(s => rowHtml(s, `<div class="bars">${bar(s.f, -m, m, '外', sg(s.f))}${bar(s.t, -m, m, '投', sg(s.t))}</div>`)).join('');
  } else if (c.kind === 'one') {
    const m = niceMax(Math.max(...ms.map(s => Math.abs(s[c.key]))));
    html += axisHtml(-m, m, '張', lw) + ms.map(s => rowHtml(s, `<div class="bars">${bar(s[c.key], -m, m, '', sg(s[c.key]))}</div>`)).join('');
  } else {
    const two = c.kind === 'streak10' || sv === '10b';
    const m = niceMax(Math.max(10, ...ms.map(s => Math.abs(s[c.key]))));
    html += axisHtml(two ? -m : 0, m, '天', lw) + ms.map(s => {
      const n = s[c.key], lab = `連${dayTxt(n, s[c.cap])}${n > 0 ? '買' : '賣'}・今天${sg(s[c.amt])}張`;
      return rowHtml(s, `<div class="bars">${bar(n, two ? -m : 0, m, '', lab)}</div>`);
    }).join('');
  }
  $('panel').innerHTML = html;
  $('panel').querySelectorAll('.subt button').forEach(b => b.onclick = () => { sub[c.id] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; st('chip_sub', JSON.stringify(sub)); renderGrid(); renderPanel(); });
  $('panel').querySelectorAll('.row').forEach(r => r.onclick = () => { openCode = openCode === r.dataset.code ? null : r.dataset.code; renderPanel(); });
  if (scroll && window.innerWidth < 720) $('panel').scrollIntoView({behavior: 'smooth', block: 'start'});
}
$('etf-tg').querySelectorAll('button').forEach(b => { b.classList.toggle('on', (b.dataset.v === '1') === withEtf);
  b.onclick = () => { withEtf = b.dataset.v === '1'; st('chip_etf', withEtf ? '1' : '0'); $('etf-tg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); renderGrid(); renderPanel(); }; });
$('sub').innerHTML = `籌碼日期 <b>${DATA.date}</b>（三大法人日報）｜全部持股 ${DATA.stocks.length} 檔（永豐＋元大）｜只看外資（不含外資自營商）跟投信`;
$('note').innerHTML = `• 資料來源：證交所「三大法人買賣超日報」、櫃買中心「三大法人買賣明細」，每天約下午3點多公布（上櫃較晚），15:30排程抓一次、晚上9:30再補一次。更新時間 ${DATA.updated}。<br>
  • 連續天數最多往回算 ${DATA.days} 個交易日，碰到上限的會顯示「≥」。今天沒有買賣（0張）就算中斷。<br>
  • 1張＝1,000股；零股成交的ETF可能顯示小數。`;
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => renderPanel(), 200); });
renderGrid(); renderPanel();
</script></body></html>
