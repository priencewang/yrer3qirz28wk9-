<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>單日持股明細</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  .viz-root {
    color-scheme: light;
    --surface-1:   #fcfcfb;
    --page-plane:  #f9f9f7;
    --text-primary:#0b0b0b;
    --text-secondary:#52514e;
    --text-muted:  #898781;
    --gridline:    #e1e0d9;
    --baseline:    #c3c2b7;
    --border:      rgba(11,11,11,0.10);
    --accent:      #2a78d6;
    --gain:        #e34948; /* 台股慣例：紅=漲/賺 */
    --loss:        #2a78d6; /* 台股慣例：藍=跌/賠 */
    --pnl-pos:     #a82424; /* 損益正數用略深紅，跟較昨日徽章的紅區分 */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .viz-root {
      color-scheme: dark;
      --surface-1:   #1a1a19;
      --page-plane:  #0d0d0d;
      --text-primary:#ffffff;
      --text-secondary:#c3c2b7;
      --text-muted:  #898781;
      --gridline:    #2c2c2a;
      --baseline:    #383835;
      --border:      rgba(255,255,255,0.10);
      --accent:      #3987e5;
      --gain:        #e66767;
      --loss:        #3987e5;
      --pnl-pos:     #c23b3b;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:   #1a1a19;
    --page-plane:  #0d0d0d;
    --text-primary:#ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:  #898781;
    --gridline:    #2c2c2a;
    --baseline:    #383835;
    --border:      rgba(255,255,255,0.10);
    --accent:      #3987e5;
    --gain:        #e66767;
    --loss:        #3987e5;
    --pnl-pos:     #c23b3b;
  }

  .viz-root {
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100%;
    padding: 28px 20px 60px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .hdr { margin-bottom: 22px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .hdr h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  .hdr p { margin: 0; color: var(--text-secondary); font-size: 13px; }
  .hdr .history-link { font-size: 12.5px; color: var(--accent); text-decoration: none; white-space: nowrap; padding-top: 4px; }
  .hdr .history-link:hover { text-decoration: underline; }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 720px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .tile .value { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .tile .delta { font-size: 12.5px; margin-top: 4px; font-weight: 600; }
  .tile .delta.up { color: var(--gain); }
  .tile .delta.down { color: var(--loss); }
  .tile .delta.flat { color: var(--text-muted); }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  .card .sub { font-size: 12px; color: var(--text-secondary); margin: 0 0 14px; }

  .basis-toggle { display: inline-flex; gap: 4px; background: var(--gridline); padding: 3px; border-radius: 8px; margin-bottom: 14px; }
  .basis-btn { font-family: inherit; font-size: 12.5px; border: none; background: transparent; color: var(--text-secondary); padding: 6px 13px; border-radius: 6px; cursor: pointer; }
  .basis-btn.is-active { background: var(--surface-1); color: var(--text-primary); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .basis-btn:hover:not(.is-active) { color: var(--text-primary); }
  .basis-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .metric-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .metric-bar .basis-toggle { margin-bottom: 0; }
  .sort-btn { font-family: inherit; font-size: 12px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); padding: 6px 11px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .sort-btn.is-active { background: var(--gridline); color: var(--text-primary); font-weight: 700; }
  .sort-btn:disabled { opacity: .4; cursor: default; }
  .sort-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pie-layout { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .pie-svg-wrap { flex-shrink: 0; }
  .pie-selected-info { min-width: 130px; flex-shrink: 0; }
  .pie-selected-info .psi-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .pie-selected-info .psi-value { font-size: 21px; font-weight: 700; line-height: 1.25; }
  .pie-legend { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 3px; }
  .pie-legend-row {
    display: flex; align-items: center; gap: 9px; font-size: 13px; cursor: pointer;
    padding: 5px 7px; border-radius: 6px; margin: -5px -7px; transition: background .12s;
  }
  .pie-legend-row:hover { background: var(--gridline); }
  .pie-legend-row.is-selected { background: var(--gridline); font-weight: 700; }
  .pie-legend-row .sw { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .pie-legend-row .name { flex: 1; color: var(--text-secondary); }
  .pie-legend-row.is-selected .name { color: var(--text-primary); }
  .pie-legend-row .pct { font-weight: 700; font-variant-numeric: tabular-nums; }
  svg text { font-family: inherit; }
  .pie-slice { cursor: pointer; transition: opacity .15s, transform .15s; transform-box: fill-box; transform-origin: center; }

  .acc-item { border: 1px solid var(--border); border-radius: 9px; margin-bottom: 8px; overflow: hidden; }
  .acc-item .acc-item { border: none; border-top: 1px solid var(--gridline); border-radius: 0; margin-bottom: 0; }
  .acc-btn {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    background: var(--page-plane); border: none; cursor: pointer; font-family: inherit; text-align: left;
    -webkit-appearance: none; list-style: none;
  }
  .acc-btn::-webkit-details-marker { display: none; }
  .acc-btn::marker { content: ""; }
  .acc-btn .swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .acc-btn .name { font-weight: 700; font-size: 14px; color: var(--text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acc-btn .quick-val { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13.5px; flex-shrink: 0; }
  /* 2026/10/28 RAY要求：損益模式的數字，正數=略深紅、負數=藍(原本一律白色) */
  .acc-btn .quick-val.pnl-up { color: var(--pnl-pos); }
  .acc-btn .quick-val.pnl-down { color: var(--loss); }
  .acc-btn .count { color: var(--text-muted); font-size: 11.5px; flex-shrink: 0; }
  .acc-btn .delta-badge { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; white-space: nowrap; }
  .acc-btn .delta-badge.up { color: var(--gain); }
  .acc-btn .delta-badge.down { color: var(--loss); }
  .acc-btn .delta-badge.flat { color: var(--text-muted); }
  .acc-btn .arrow { color: var(--text-muted); transition: transform .15s; flex-shrink: 0; }
  details[open] > .acc-btn .arrow { transform: rotate(90deg); }
  .acc-btn:hover { background: var(--gridline); }
  .acc-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .acc-item .acc-item .acc-btn { padding: 9px 14px 9px 30px; }
  .acc-item .acc-item .acc-btn .name { font-size: 13px; font-weight: 600; }
  .acc-sublist { background: var(--gridline); }
  .acc-sublist .acc-item .acc-btn { background: var(--surface-1); }
  .acc-sublist .acc-item .acc-btn:hover { background: var(--page-plane); }

  .detail-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px;
    background: var(--gridline); border-top: 1px solid var(--gridline);
  }
  .detail-field { background: var(--surface-1); padding: 10px 14px; }
  .detail-field .f-label { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
  .detail-field .f-value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .detail-field .f-value.pnl-up { color: var(--gain); }
  .detail-field .f-value.pnl-down { color: var(--loss); }

  .empty-hint { text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px 0; }

  .footnote { font-size: 11.5px; color: var(--text-muted); line-height: 1.7; margin-top: 22px; border-top: 1px solid var(--gridline); padding-top: 14px; }
</style>
</head>

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('snapshot-data').textContent);
  const cs = getComputedStyle(document.querySelector('.viz-root'));
  const tok = (name) => cs.getPropertyValue(name).trim();
  const fmtMoney = (n) => n === null || n === undefined ? '—' : '$' + Math.round(n).toLocaleString('en-US');
  const fmtNum = (n, d) => n === null || n === undefined ? '—' : n.toLocaleString('en-US', { maximumFractionDigits: d === undefined ? 0 : d, minimumFractionDigits: d === undefined ? 0 : d });
  const fmtPct = (n, d) => n === null || n === undefined ? '—' : (n > 0 ? '+' : '') + n.toFixed(d === undefined ? 1 : d) + '%';
  // 2026/09/16新增：手風琴收合狀態旁邊的「較昨日」小徽章，把N損益變化/O產業損益變化
  // 從第三層完整明細往上提，不用展開到最裡面就看得到方向跟金額。null/undefined代表
  // 沒有昨天的資料可比對(例如第一天)，不顯示徽章；剛好=0顯示中性樣式，不套紅藍箭頭。
  function deltaBadgeHtml(v) {
    if (v === null || v === undefined) return '';
    if (v === 0) return '<span class="delta-badge flat">±$0</span>';
    const dir = v > 0 ? 'up' : 'down';
    const arrow = v > 0 ? '▲' : '▼';
    return '<span class="delta-badge ' + dir + '">' + arrow + fmtMoney(Math.abs(v)) + '</span>';
  }
  // 2026/09/16新增：KPI卡片(總市值/總成本)底下的變化文字，跟deltaBadgeHtml同一套
  // 箭頭+紅藍配色邏輯，只是外層容器是.tile .delta而不是.delta-badge，格式跟著沿用。
  // (2026/09/17拿掉「（較昨日）」字樣，RAY覺得贅字，箭頭+金額已經夠清楚)
  function tileDelta(v) {
    if (v === null || v === undefined) return null;
    if (v === 0) return { text: '±$0', dir: 'flat' };
    const dir = v > 0 ? 'up' : 'down';
    const arrow = v > 0 ? '▲' : '▼';
    return { text: arrow + fmtMoney(Math.abs(v)), dir };
  }
  // 2026/09/17新增：持股檔數旁邊的「較昨日」增減，跟tileDelta同一套邏輯，只是單位是
  // 「檔」不是金額，不能共用fmtMoney。
  function tileCountDelta(v) {
    if (v === null || v === undefined) return null;
    if (v === 0) return { text: '±0 檔', dir: 'flat' };
    const dir = v > 0 ? 'up' : 'down';
    const arrow = v > 0 ? '▲' : '▼';
    return { text: arrow + Math.abs(v) + ' 檔', dir };
  }
  const SVGNS = 'http://www.w3.org/2000/svg';
  const svgEl = (tag, attrs) => { const el = document.createElementNS(SVGNS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };

  document.getElementById('hdr-sub').textContent =
    '特許專戶．' + DATA.date + '（來源：' + DATA.source_file + '）';

  // ---------- KPI ----------
  const kpi = DATA.kpi;
  const pnlPct = kpi.total_cost ? (kpi.total_pnl / kpi.total_cost) * 100 : 0;
  const valueDelta = tileDelta(kpi.total_value_change);
  const costDelta = tileDelta(kpi.total_cost_change);
  const countDelta = tileCountDelta(kpi.stock_count_change);
  const tiles = [
    { label: '總市值', value: fmtMoney(kpi.total_value), delta: valueDelta ? valueDelta.text : null, dir: valueDelta ? valueDelta.dir : null },
    { label: '總成本', value: fmtMoney(kpi.total_cost), delta: costDelta ? costDelta.text : null, dir: costDelta ? costDelta.dir : null },
    { label: '未實現損益', value: fmtMoney(kpi.total_pnl), delta: fmtPct(pnlPct) + '（對成本）', dir: kpi.total_pnl >= 0 ? 'up' : 'down' },
    { label: '持股檔數', value: kpi.stock_count + ' 檔', delta: countDelta ? countDelta.text : null, dir: countDelta ? countDelta.dir : null },
  ];
  const kpiRow = document.getElementById('kpi-row');
  tiles.forEach(t => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = '<div class="label"></div><div class="value"></div>' + (t.delta ? '<div class="delta"></div>' : '');
    tile.querySelector('.label').textContent = t.label;
    tile.querySelector('.value').textContent = t.value;
    if (t.delta) { const d = tile.querySelector('.delta'); d.textContent = t.delta; d.classList.add(t.dir); }
    kpiRow.appendChild(tile);
  });

  // ---------- Pie chart ----------
  // 2026/09/11改版：RAY要求Excel裡11種產業分類全部完整顯示、不要折成「其他」，顏色直接
  // 沿用DATA.pie_colors(跟fetch_holdings_shioaji.py「每日庫存」Excel報告同一組11色
  // 莫蘭迪色票，資料準備階段(build_daily_snapshot_data.py)已經算好，不用再靠CSS token)。
  function textColorFor(bgHex) {
    // 莫蘭迪色票偏淺色，固定用白字在淺底上會看不清楚，跟其他頁面同一套亮度反推邏輯
    const hex = bgHex.replace('#', '');
    const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
    const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
    return luminance < 140 ? '#ffffff' : '#2a2a28';
  }
  let selectedSliceIndex = null; // 2026/09/11新增：點圖例/切片高亮聯動用，切換市值/成本時歸零

  function renderPie(basis) {
    const wrap = document.getElementById('pie-svg-wrap');
    const legend = document.getElementById('pie-legend');
    const infoEl = document.getElementById('pie-selected-info');
    wrap.innerHTML = ''; legend.innerHTML = ''; infoEl.innerHTML = '';
    const dataMap = basis === 'cost' ? DATA.pie_cost : DATA.pie_value;
    const cats = DATA.pie_categories;
    const pieColors = DATA.pie_colors;
    const slices = {}; // 用原始類別索引(i)當key，不是畫圖順序，顏色/選取狀態才不會錯亂
    // 2026/09/17新增：RAY要求圓餅圖跟圖例依百分比由高到低排列(原本是固定依產業編號
    // 1~11排序)。顏色仍然固定跟著原始類別索引(i)走，不會因為排序換位置就換色——
    // 「畫的順序」變了，但「這個類別永遠是這個顏色」的CVD安全規則沒有變。
    const order = cats.map((c, i) => i).sort((a, b) => (dataMap[cats[b]] || 0) - (dataMap[cats[a]] || 0));

    // 2026/09/16新增：點切片/圖例時，右側空白區顯示該產業的實際金額(不是百分比)——
    // 成本佔比模式顯示這個產業總共投入多少成本，市值佔比模式顯示目前市值多少。
    // 直接從table_rows加總(跟區塊2「完整持股明細」同樣的算法)，不用百分比反推、避免
    // 四捨五入誤差。
    const categoryAbsTotal = {};
    cats.forEach(c => {
      categoryAbsTotal[c] = DATA.table_rows
        .filter(r => r.industry === c)
        .reduce((s, r) => s + (basis === 'cost' ? (r.cost_total || 0) : (r.value || 0)), 0);
    });

    const size = 240, r = 95, rInner = 56, cx = size / 2, cy = size / 2;
    const svg = svgEl('svg', { viewBox: '0 0 ' + size + ' ' + size, width: size, height: size, style: 'overflow:visible' });
    let angle = -Math.PI / 2;
    const total = cats.reduce((s, c) => s + (dataMap[c] || 0), 0) || 100;
    order.forEach(i => {
      const c = cats[i];
      const v = dataMap[c] || 0;
      const frac = v / total;
      const a0 = angle, a1 = angle + frac * Math.PI * 2;
      angle = a1;
      const large = (a1 - a0) > Math.PI ? 1 : 0;
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      const xi0 = cx + rInner * Math.cos(a1), yi0 = cy + rInner * Math.sin(a1);
      const xi1 = cx + rInner * Math.cos(a0), yi1 = cy + rInner * Math.sin(a0);
      const d = 'M' + x0 + ',' + y0 + ' A' + r + ',' + r + ' 0 ' + large + ' 1 ' + x1 + ',' + y1 +
        ' L' + xi0 + ',' + yi0 + ' A' + rInner + ',' + rInner + ' 0 ' + large + ' 0 ' + xi1 + ',' + yi1 + ' Z';
      const path = svgEl('path', { d, fill: pieColors[i], stroke: tok('--surface-1'), 'stroke-width': 2, class: 'pie-slice' });
      const title = document.createElementNS(SVGNS, 'title');
      title.textContent = c + '：' + v.toFixed(1) + '%';
      path.appendChild(title);
      path.addEventListener('click', () => selectSlice(i));
      svg.appendChild(path);
      slices[i] = { path, midAngle: (a0 + a1) / 2 };
      // direct label for slices >= 5%(11類之後平均一塊約9%，門檻跟著調低一點，太小的
      // 塊(例如0.3%)標了也塞不下、字會重疊，留給圖例+tooltip承接就好)
      if (frac >= 0.05) {
        const mid = (a0 + a1) / 2;
        const lx = cx + (r + rInner) / 2 * Math.cos(mid);
        const ly = cy + (r + rInner) / 2 * Math.sin(mid);
        const t = svgEl('text', { x: lx, y: ly + 4, 'text-anchor': 'middle', 'font-size': '11.5', 'font-weight': '700', fill: textColorFor(pieColors[i]), style: 'pointer-events:none' });
        // 2026/10/01 RAY要求：圓餅圖切片內的百分比文字跟下面圖例列表(.pct，toFixed(1))
        // 對不起來(切片原本四捨五入到整數，圖例保留小數點後1位)，統一改成跟圖例同一套
        // toFixed(1)，數字才會完全一致，不會讓RAY覺得兩處數字兜不起來。
        t.textContent = v.toFixed(1) + '%';
        svg.appendChild(t);
      }
    });
    // center label
    const centerLabel = svgEl('text', { x: cx, y: cy - 3, 'text-anchor': 'middle', 'font-size': '11', fill: tok('--text-muted') });
    centerLabel.textContent = basis === 'cost' ? '成本佔比' : '市值佔比';
    svg.appendChild(centerLabel);
    const centerDate = svgEl('text', { x: cx, y: cy + 13, 'text-anchor': 'middle', 'font-size': '11', 'font-weight': '700', fill: tok('--text-primary') });
    centerDate.textContent = DATA.date;
    svg.appendChild(centerDate);
    wrap.appendChild(svg);

    order.forEach(i => {
      const c = cats[i];
      const row = document.createElement('div');
      row.className = 'pie-legend-row';
      row.dataset.index = i;
      row.innerHTML = '<span class="sw"></span><span class="name"></span><span class="pct"></span>';
      row.querySelector('.sw').style.background = pieColors[i];
      row.querySelector('.name').textContent = c;
      row.querySelector('.pct').textContent = (dataMap[c] || 0).toFixed(1) + '%';
      row.addEventListener('click', () => selectSlice(i));
      legend.appendChild(row);
    });

    // 2026/09/11新增：點圖例或圓餅圖切片，選中的那塊往外推出+其餘變暗，方便RAY一眼
    // 對出「這塊」對應哪個產業；再點一次同一塊(或已經沒有選取)則全部恢復正常。
    function selectSlice(i) {
      selectedSliceIndex = selectedSliceIndex === i ? null : i;
      if (selectedSliceIndex === null) {
        infoEl.innerHTML = '';
      } else {
        const cat = cats[selectedSliceIndex];
        infoEl.innerHTML = '<div class="psi-label"></div><div class="psi-value"></div>';
        infoEl.querySelector('.psi-label').textContent = cat + (basis === 'cost' ? '　投入成本' : '　目前市值');
        infoEl.querySelector('.psi-value').textContent = fmtMoney(categoryAbsTotal[cat]);
      }
      order.forEach(idx => {
        const s = slices[idx];
        const isSel = selectedSliceIndex === idx;
        const dim = selectedSliceIndex !== null && !isSel;
        s.path.style.opacity = dim ? '0.35' : '1';
        s.path.style.strokeWidth = isSel ? '3' : '2';
        if (isSel) {
          const dx = Math.cos(s.midAngle) * 9, dy = Math.sin(s.midAngle) * 9;
          s.path.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        } else {
          s.path.style.transform = '';
        }
      });
      legend.querySelectorAll('.pie-legend-row').forEach(row => {
        row.classList.toggle('is-selected', Number(row.dataset.index) === selectedSliceIndex);
      });
    }
  }
  renderPie('value');
  document.getElementById('pie-toggle').addEventListener('click', (e) => {
    const btn = e.target.closest('.basis-btn');
    if (!btn) return;
    document.querySelectorAll('#pie-toggle .basis-btn').forEach(b => b.classList.toggle('is-active', b === btn));
    selectedSliceIndex = null;
    renderPie(btn.dataset.basis);
  });

  // ---------- 完整持股明細：產業分類 → 個股 → 完整欄位，三層手風琴 ----------
  // 2026/09/11改版(RAY要求)：不要橫向拉動的表格，改成先看11個產業分類(跟圓餅圖同順序、
  // 同顏色)，點分類展開該分類下的持股，每檔股票不顯示代碼(RAY要求移除)，點股票名稱再
  // 展開完整15個欄位(沿用原本已經做好的detail-grid)。分類/個股旁邊顯示損益或市值，
  // 依上方「損益/市值」切換鈕決定，兩層都跟著同一個開關切換。
  const DETAIL_FIELDS = [
    { key: 'industry', label: '產業', text: true },
    { key: 'shares', label: '持股(今日餘額)', fmt: (v) => fmtNum(v) },
    { key: 'price', label: '現價', fmt: (v) => fmtNum(v, 2) },
    { key: 'cost_avg', label: '成本均價', fmt: (v) => fmtNum(v, 2) },
    { key: 'value', label: '市值', fmt: fmtMoney },
    { key: 'cost_total', label: '付出成本', fmt: fmtMoney },
    { key: 'pnl', label: '損益試算', fmt: fmtMoney, pnlColor: true },
    { key: 'industry_ratio', label: '產業占比', fmt: (v) => fmtPct(v, 2) },
    { key: 'industry_cost', label: '產業成本', fmt: fmtMoney },
    // 2026/09/16新增：K/L/M這3欄本來是純黑白數字，補上跟損益一樣的紅漲藍跌上色，
    // 正負方向一眼看出來(沿用專案既有配色，不套用Excel報告本身的「紅正綠負」)。
    { key: 'cost_change', label: '成本變化', fmt: fmtMoney, pnlColor: true },
    { key: 'industry_cost_change', label: '產業成本變化', fmt: fmtMoney, pnlColor: true },
    { key: 'ratio_change', label: '占比變化', fmt: (v) => fmtPct(v, 2), pnlColor: true },
    { key: 'pnl_change', label: '損益變化', fmt: fmtMoney, pnlColor: true },
    { key: 'industry_pnl_change', label: '產業損益變化', fmt: fmtMoney, pnlColor: true },
  ];

  function buildDetailGrid(r) {
    const grid = document.createElement('div');
    grid.className = 'detail-grid';
    DETAIL_FIELDS.forEach(f => {
      const raw = r[f.key];
      const field = document.createElement('div');
      field.className = 'detail-field';
      const label = document.createElement('div');
      label.className = 'f-label';
      label.textContent = f.label;
      const value = document.createElement('div');
      value.className = 'f-value';
      value.textContent = f.text ? (raw || '—') : (f.fmt ? f.fmt(raw) : (raw === null || raw === undefined ? '—' : raw));
      if (f.pnlColor && raw !== null && raw !== undefined) value.classList.add(raw >= 0 ? 'pnl-up' : 'pnl-down');
      field.appendChild(label);
      field.appendChild(value);
      grid.appendChild(field);
    });
    return grid;
  }

  let metric = 'pnl'; // 'pnl'/'value'/'cost_total'，跟上方切換鈕連動
  let sortByDelta = false; // 「較昨日 高→低」排序按鈕狀態
  // 2026/09/16新增：切換鈕跟旁邊的「較昨日」徽章要顯示哪個變化欄位是連動的——損益模式
  // 看N/O，成本模式看K/L；市值沒有對應的每日變化欄位可比對，就不顯示徽章。
  const DELTA_KEY = { pnl: 'pnl_change', cost_total: 'cost_change' };
  const DELTA_KEY_INDUSTRY = { pnl: 'industry_pnl_change', cost_total: 'industry_cost_change' };

  function renderCategoryList() {
    const list = document.getElementById('category-list');
    // 重繪前先記住哪些手風琴是展開的，重繪後還原，不會每次切換損益/市值都全部收合
    const openCats = new Set(Array.from(list.querySelectorAll(':scope > .acc-item[open]')).map(d => d.dataset.cat));
    const openCodes = new Set(Array.from(list.querySelectorAll('.acc-item .acc-item[open]')).map(d => d.dataset.code));
    list.innerHTML = '';

    // 2026/09/17新增：RAY要求依目前切換鈕(損益/市值/成本)的數值由高至低排序，不再
    // 固定依產業編號1~11——顏色還是照原始類別索引(i)走，只有排列順序改變。
    // 2026/10/28新增：「較昨日 高→低」按鈕開啟時，改依最右側的較昨日變化排序
    // (產業依產業變化、產業內個股依個股變化)；沒有昨日資料的排最後。
    const industryDeltaKey = DELTA_KEY_INDUSTRY[metric];
    const stockDeltaKey = DELTA_KEY[metric];
    const useDeltaSort = sortByDelta && !!stockDeltaKey;
    const deltaOrNull = (v) => (v === null || v === undefined) ? null : v;
    const byDesc = (va, vb) => (va === null) - (vb === null) || (vb || 0) - (va || 0);
    const categoryInfos = DATA.pie_categories
      .map((cat, i) => {
        const stocks = DATA.table_rows.filter(r => r.industry === cat);
        const total = stocks.reduce((s, r) => s + (r[metric] || 0), 0);
        // O產業損益變化／L產業成本變化都是整個產業族群共用的同一個數字(每檔股票的資料裡
        // 都重複存了一份)，取任一筆非空值即可，不用加總；市值模式沒有對應變化欄位
        const catDelta = industryDeltaKey
          ? stocks.map(r => r[industryDeltaKey]).find(v => v !== null && v !== undefined)
          : undefined;
        return { cat, i, stocks, total, catDelta, color: DATA.pie_colors[i] };
      })
      .filter(info => info.stocks.length)
      .sort((a, b) => useDeltaSort ? byDesc(deltaOrNull(a.catDelta), deltaOrNull(b.catDelta)) : b.total - a.total);

    categoryInfos.forEach(({ cat, i, stocks, total, catDelta, color }) => {
      const catItem = document.createElement('details');
      catItem.className = 'acc-item';
      catItem.dataset.cat = cat;
      if (openCats.has(cat)) catItem.open = true;

      const catSummary = document.createElement('summary');
      catSummary.className = 'acc-btn';
      // 成本本身沒有「賺賠」語意(投入多少就是多少)，不套紅漲藍跌上色，避免RAY誤以為
      // 紅色代表獲利；損益/市值維持原本依正負上色
      // 2026/10/28起只有損益模式上色(正=略深紅/負=藍)；市值恆為正數，上色沒意義
      const catColorCls = metric === 'pnl' ? (total >= 0 ? 'pnl-up' : 'pnl-down') : '';
      catSummary.innerHTML =
        '<span class="swatch" style="background:' + color + '"></span>' +
        '<span class="name"></span><span class="count"></span>' +
        '<span class="quick-val ' + catColorCls + '"></span>' + deltaBadgeHtml(catDelta) +
        '<span class="arrow">▶</span>';
      catSummary.querySelector('.name').textContent = cat;
      catSummary.querySelector('.count').textContent = stocks.length + '檔';
      catSummary.querySelector('.quick-val').textContent = fmtMoney(total);
      catItem.appendChild(catSummary);

      const sub = document.createElement('div');
      sub.className = 'acc-sublist';
      stocks.slice().sort((a, b) => useDeltaSort
        ? byDesc(deltaOrNull(a[stockDeltaKey]), deltaOrNull(b[stockDeltaKey]))
        : (b[metric] || 0) - (a[metric] || 0)).forEach(r => {
        const stockItem = document.createElement('details');
        stockItem.className = 'acc-item';
        stockItem.dataset.code = r.code;
        if (openCodes.has(r.code)) stockItem.open = true;

        const stockSummary = document.createElement('summary');
        stockSummary.className = 'acc-btn';
        const valColor = metric === 'pnl' ? ((r[metric] || 0) >= 0 ? 'pnl-up' : 'pnl-down') : '';
        const stockDelta = stockDeltaKey ? r[stockDeltaKey] : undefined;
        stockSummary.innerHTML =
          '<span class="name"></span><span class="quick-val ' + valColor + '"></span>' +
          deltaBadgeHtml(stockDelta) + '<span class="arrow">▶</span>';
        stockSummary.querySelector('.name').textContent = r.name;
        stockSummary.querySelector('.quick-val').textContent = fmtMoney(r[metric]);
        stockItem.appendChild(stockSummary);
        stockItem.appendChild(buildDetailGrid(r));
        sub.appendChild(stockItem);
      });
      catItem.appendChild(sub);
      list.appendChild(catItem);
    });
  }
  renderCategoryList();

  document.getElementById('metric-toggle').addEventListener('click', (e) => {
    const btn = e.target.closest('.basis-btn');
    if (!btn) return;
    document.querySelectorAll('#metric-toggle .basis-btn').forEach(b => b.classList.toggle('is-active', b === btn));
    metric = btn.dataset.metric;
    syncSortBtn();
    renderCategoryList();
  });

  // 市值模式沒有較昨日數字，排序按鈕停用
  const sortBtn = document.getElementById('delta-sort-btn');
  function syncSortBtn() {
    const usable = !!DELTA_KEY[metric];
    sortBtn.disabled = !usable;
    sortBtn.classList.toggle('is-active', sortByDelta && usable);
    sortBtn.setAttribute('aria-pressed', String(sortByDelta && usable));
  }
  sortBtn.addEventListener('click', () => {
    sortByDelta = !sortByDelta;
    syncSortBtn();
    renderCategoryList();
  });
  syncSortBtn();

  // ---------- 今日已實現損益(2026/10/13新增，RAY要求) ----------
  // 背景：股票賣掉後成本+獲利一併變現、從「目前庫存」清單消失，單靠上面的市值/成本/
  // 損益完全看不出「今天賣出到底實際收回多少現金」，這段資料是跟持股清單完全獨立的
  // 補充資訊，來源是fetch_realized_pnl.py查永豐「已實現損益」API產生的realized_pnl。
  // RAY明確要求「沒賣出股票時整個區塊(含標題)都隱藏」，所以用JS動態決定要不要插入
  // 這張卡片，不是寫死在HTML裡用CSS切換顯示/隱藏——跟generate_mobile_report.py裡
  // 「4條件篩選」沒有資料就整塊不顯示的做法同一個原則。
  const RP_FIELDS = [
    { key: 'quantity', label: '賣出股數', fmt: (v) => fmtNum(v) },
    { key: 'entry_price', label: '平均買進價', fmt: (v) => fmtNum(v, 2) },
    { key: 'cover_price', label: '平均賣出價', fmt: (v) => fmtNum(v, 2) },
    { key: 'entry_cost', label: '原始成本', fmt: fmtMoney },
    { key: 'cover_cost', label: '賣出收回金額', fmt: fmtMoney },
    { key: 'pnl', label: '已實現損益', fmt: fmtMoney, pnlColor: true },
    { key: 'pr_ratio', label: '報酬率', fmt: (v) => fmtPct(v, 2), pnlColor: true },
  ];

  function renderRealizedPnl() {
    const wrap = document.getElementById('realized-pnl-wrap');
    wrap.innerHTML = '';
    const rp = DATA.realized_pnl;
    if (!rp || !rp.has_sales || !rp.records || !rp.records.length) return; // 沒賣出：整塊不顯示

    const card = document.createElement('div');
    card.className = 'card';
    const total = rp.total || {};
    card.innerHTML =
      '<h2>3 · 今日已實現損益</h2>' +
      '<p class="sub">今天賣出股票的實際收回金額跟賺賠，跟上面「目前庫存」是獨立的兩筆帳</p>' +
      '<div class="kpi-row" id="rp-kpi-row" style="margin-bottom:14px;"></div>' +
      '<div id="rp-list"></div>';
    wrap.appendChild(card);

    const rpKpiRow = card.querySelector('#rp-kpi-row');
    const rpTiles = [
      { label: '賣出筆數', value: rp.records.length + ' 筆' },
      { label: '賣出收回總金額', value: fmtMoney(total.cover_amount) },
      { label: '已實現損益小計', value: fmtMoney(total.pnl), dir: (total.pnl || 0) >= 0 ? 'up' : 'down' },
      { label: '整體報酬率', value: fmtPct(total.pr_ratio, 2), dir: (total.pr_ratio || 0) >= 0 ? 'up' : 'down' },
    ];
    rpTiles.forEach(t => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = '<div class="label"></div><div class="value"></div>';
      tile.querySelector('.label').textContent = t.label;
      const valueEl = tile.querySelector('.value');
      valueEl.textContent = t.value;
      if (t.dir) valueEl.classList.add(t.dir === 'up' ? 'pnl-up' : 'pnl-down');
      rpKpiRow.appendChild(tile);
    });

    const list = card.querySelector('#rp-list');
    rp.records.forEach(r => {
      const item = document.createElement('details');
      item.className = 'acc-item';
      const summary = document.createElement('summary');
      summary.className = 'acc-btn';
      const valColor = (r.pnl || 0) >= 0 ? 'pnl-up' : 'pnl-down';
      summary.innerHTML =
        '<span class="name"></span><span class="quick-val ' + valColor + '"></span>' +
        '<span class="arrow">▶</span>';
      summary.querySelector('.name').textContent = r.name + '（' + r.code + '）';
      summary.querySelector('.quick-val').textContent = fmtMoney(r.pnl) + '　' + fmtPct(r.pr_ratio, 2);
      item.appendChild(summary);

      const grid = document.createElement('div');
      grid.className = 'detail-grid';
      RP_FIELDS.forEach(f => {
        const raw = r[f.key];
        const field = document.createElement('div');
        field.className = 'detail-field';
        field.innerHTML = '<div class="f-label"></div><div class="f-value"></div>';
        field.querySelector('.f-label').textContent = f.label;
        const valueEl = field.querySelector('.f-value');
        valueEl.textContent = f.fmt ? f.fmt(raw) : (raw === null || raw === undefined ? '—' : raw);
        if (f.pnlColor && raw !== null && raw !== undefined) valueEl.classList.add(raw >= 0 ? 'pnl-up' : 'pnl-down');
        grid.appendChild(field);
      });
      item.appendChild(grid);
      list.appendChild(item);
    });
  }
  renderRealizedPnl();

  // ---------- footnote ----------
  const ex = DATA.excluded || [];
  let exText = '';
  if (ex.length) {
    exText = '<br><b>已排除：</b>' + ex.map(d => '代碼 ' + d.code + '（已下市，不計入任何統計）').join('、') + '。';
  }
  document.getElementById('footnote').innerHTML =
    '資料來源：每日庫存/' + DATA.source_file + '　·　圓餅圖「市值佔比」= 現價×持股股數，「成本佔比」= 成本均價×持股股數（對應Excel「產業占比」欄位邏輯），完整顯示全部11種產業分類，顏色跟每日庫存Excel報告一致。「今日已實現損益」資料來源：永豐Shioaji已實現損益查詢，跟上面的庫存清單互相獨立。' + exText;
})();
</script>

</body>
</html>
