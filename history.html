<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歷史報告列表</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  .viz-root {
    color-scheme: light;
    --surface-1:   #fcfcfb;
    --page-plane:  #f9f9f7;
    --text-primary:#0b0b0b;
    --text-secondary:#52514e;
    --text-muted:  #898781;
    --gridline:    #e1e0d9;
    --border:      rgba(11,11,11,0.10);
    --accent:      #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .viz-root {
      color-scheme: dark;
      --surface-1:   #1a1a19;
      --page-plane:  #0d0d0d;
      --text-primary:#ffffff;
      --text-secondary:#c3c2b7;
      --text-muted:  #898781;
      --gridline:    #2c2c2a;
      --border:      rgba(255,255,255,0.10);
      --accent:      #3987e5;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:   #1a1a19;
    --page-plane:  #0d0d0d;
    --text-primary:#ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:  #898781;
    --gridline:    #2c2c2a;
    --border:      rgba(255,255,255,0.10);
    --accent:      #3987e5;
  }
  .viz-root {
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100%;
    padding: 28px 20px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .hdr { margin-bottom: 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .hdr h1 { font-size: 20px; font-weight: 700; margin: 0 0 6px; }
  .hdr p { margin: 0; color: var(--text-secondary); font-size: 12.5px; }
  .hdr .back-link { font-size: 12.5px; color: var(--accent); text-decoration: none; white-space: nowrap; padding-top: 3px; }
  .hdr .back-link:hover { text-decoration: underline; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 6px 8px; }
  .month-label { font-size: 12.5px; font-weight: 700; color: var(--text-secondary); padding: 12px 12px 6px; }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 11px 12px; text-decoration: none;
    color: var(--text-primary); border-radius: 8px;
  }
  .row:hover { background: var(--gridline); }
  .row .date { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .row .wd { color: var(--text-muted); font-size: 12.5px; flex: 1; }
  .row .arrow { color: var(--text-muted); font-size: 15px; }
  .empty { padding: 24px 12px; color: var(--text-secondary); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<div class="viz-root">
  <div class="wrap">
    <div class="hdr">
      <div>
        <h1>歷史報告列表</h1>
        <p>單日持股明細．共 5 天存檔</p>
      </div>
      <a class="back-link" href="index.html">‹ 回到最新</a>
    </div>
    <div class="card">
      <div class="month-label">2026年9月</div>

      <a class="row" href="archive/2026-09-17.html"><span class="date">2026-09-17</span><span class="wd">星期四</span><span class="arrow">›</span></a>
      <a class="row" href="archive/2026-09-16.html"><span class="date">2026-09-16</span><span class="wd">星期三</span><span class="arrow">›</span></a>
    </div>
  </div>
</div>
</body>
</html>
